      properties:
        vendorId: { type: string }
        currency: { type: string }
        ownerIds: { type: array, items: { type: string }, description: "Replaces the owners (purchasers by roleSnapshot); required (400 `invalid_request` when missing), `[]` clears. Newly added owners get `assignment.added`." }
        externalOrderNo: { type: string }
        chargedAmountBase: { type: [string, "null"] }
        expectedDeliveryDate: { type: string }
        paymentNote: { type: string }
    AddLineRequest:
      type: object
      additionalProperties: false
      properties:
        itemId: { type: string }
        teamId: { type: string }
        name: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: [string, "null"] }
    ReplaceLineRequest:
      type: object
      additionalProperties: false
      required: [teamId, name, quantity]
      properties:
        teamId: { type: string }
        name: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: [string, "null"] }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string }
    RefundInput:
      type: object
      additionalProperties: false
      required: [currency, amount, method]
      properties:
        currency: { type: string, description: Any supported currency. }
        amount: { type: string, description: Positive decimal string in `currency`; stored negative. }
        actualAmountBase: { type: [string, "null"], description: "Positive decimal string; the real base-currency amount, may be filled later by editing the entry." }
        method: { type: string, enum: [cash, coupon] }
        note: { type: string }
    CostEntryRequest:
      type: object
      additionalProperties: false
      required: [type, currency, amount]
      properties:
        type: { type: string, enum: [shipping, fee, tax, discount, coupon_used, refund, extra_charge, other] }
        settlement: { type: string, enum: [with_checkout, separate], description: "Required except for refund and extra_charge, which are always separate." }
        currency: { type: string, description: "with_checkout: the order currency; separate: any supported currency." }
        amount: { type: string, description: "Signed decimal string, non-zero: discounts and refunds negative, coupon_used and extra_charge positive." }
        actualAmountBase: { type: [string, "null"], description: "Separate entries only: the real base-currency amount, same sign as amount." }
        refundMethod: { type: [string, "null"], enum: [cash, coupon, null], description: "Required for refunds, forbidden otherwise." }
        allocation: { $ref: "#/components/schemas/CostAllocation" }
        note: { type: string, description: "Required when the allocation mode is not all, and for refund, extra_charge, coupon_used and other." }
    CloseLineRequest:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type: { type: string, enum: [short_accepted, not_obtained] }
        reason: { type: string }
        refund: { anyOf: [{ $ref: "#/components/schemas/RefundInput" }, { type: "null" }] }
    UnpurchasableRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string }
    AuditChange:
      type: object
      required: [field, from, to]
      properties:
        field: { type: string }
        from:
          description: Previous value; any JSON type, null when there was none.
          type: [string, number, integer, boolean, object, array, "null"]
        to:
          description: New value; any JSON type, null when cleared.
          type: [string, number, integer, boolean, object, array, "null"]
    AuditEvent:
      type: object
      required: [id, at, actor, teamIds, objectType, objectId, action, changes]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: 'User id, or "system:<job>".' }
        teamIds: { type: array, items: { type: string }, description: Teams involved in the event. }
        batchId: { type: string, description: "Set for batch, item and linked vendor order line events." }
        objectType: { type: string }
        objectId: { type: string }
        action: { type: string, description: 'e.g. batch.created, batch.open, item.approved.' }
        changes: { type: [array, "null"], items: { $ref: "#/components/schemas/AuditChange" } }
        comment: { type: string }
    BatchPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Batch" } }
        nextCursor: { type: [string, "null"] }
    LinkedLine:
      type: object
      required: [id, vendorOrderId, vendorOrderNumber, orderStatus, status, quantity, receivedQuantity]
      properties:
        id: { type: string }
        vendorOrderId: { type: string }
        vendorOrderNumber: { type: integer }
        orderStatus: { type: string, enum: [draft, placed, cancelled] }
        status: { $ref: "#/components/schemas/LineStatus" }
        quantity: { type: integer }
