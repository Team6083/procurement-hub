openapi: 3.1.0
info:
  title: procurement-hub API
  version: 0.1.0
  description: |
    Common headers. Every response carries `X-App-Commit`, `X-Request-ID` and
    `X-Content-Type-Options: nosniff`, and `X-App-Version` when the build is a release tag. Clients may send `X-Request-ID` (1–128 characters from
    `A-Z a-z 0-9 - _ . :`) to correlate a request with server logs; the server echoes it, or generates an id
    when it is missing or invalid. Error responses document `X-Request-ID` explicitly; quote it when
    reporting a problem.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Deployment metadata (unauthenticated)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /me:
    get:
      operationId: getMe
      summary: Current user profile, memberships and system-admin flag
      description: The `ETag` header (and `version` field) is the value to send in `If-Match` on `PATCH /me`.
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchMe
      summary: Update locale and/or notification preferences
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchMeRequest" }
      responses:
        "200":
          description: Updated profile
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /users:
    get:
      operationId: searchUsers
      summary: Search users who have logged in at least once
      description: |
        Only system admins, purchasers, receivers and members of at least one team may search (otherwise 403).
        `role=purchaser|receiver` limits results to users whose `roleSnapshot` has that role (assignment candidates only, never authorization).
        `q` must contain at least 2 characters after trimming (otherwise 400 `invalid_request`), except that it may be
        omitted when `role` is given (then the role holders are listed, for assignment pickers).
        At most 20 users are returned. Not paginated: the response is `{items}` only.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string, enum: [purchaser, receiver] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /lookup:
    get:
      operationId: lookupProduct
      summary: Look up a product by SKU or product URL
      description: |
        Calls the configured product lookup provider on the server (spec section 14). Limited to 30 requests per
        minute per user (`429 rate_limited`). `vendorId` is set when the provider's store name matches an active
        vendor's name or alias (case-insensitive); `vendorName` is then the vendor's name. Otherwise `vendorId` is
        null and `vendorName` is the store name as the provider reported it. Codes: `lookup_not_found` (404),
        `lookup_disabled` (503, `LOOKUP_PROVIDER=none`), `upstream_unavailable` (503), `upstream_timeout` (504),
        `rate_limited` (429), `invalid_request` (400, `q` missing). Upstream error details are never returned.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: SKU or product URL. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: "`rate_limited`. `Retry-After` gives the seconds to wait."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504":
          description: "`upstream_timeout`: the provider did not answer within `LOOKUP_TIMEOUT`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /vendors:
    get:
      operationId: listVendors
      summary: List vendors (everyone)
      description: "`q` matches names and aliases (case-insensitive substring); inactive vendors only with `includeInactive=true`. Not paginated."
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: includeInactive, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createVendor
      summary: Create a vendor (purchasers and system admins)
      description: 422 `vendor_name_taken` when the name or an alias collides with another vendor's name or alias (case-insensitive, trimmed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: replaceVendor
      summary: Replace a vendor (purchasers and system admins); deactivate with active=false
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorRequest" }
      responses:
        "200":
          description: Updated vendor
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /reference-rates:
    get:
      operationId: listReferenceRates
      summary: Global reference rates to the base currency (everyone)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceRateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /reference-rates/{currency}:
    parameters:
      - name: currency
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putReferenceRate
      summary: Create or replace one currency's rate (system admins)
      description: |
        Without `If-Match` the rate is created (201; 428 `if_match_required` when it already exists).
        With `If-Match` it replaces the existing rate (200). The base currency and unsupported currencies are 400.
        Every write schedules the `vendor_orders.recompute` job for the currency.
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutReferenceRateRequest" }
      responses:
        "200":
          description: Replaced
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceRate" }
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceRate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteReferenceRate
      summary: Delete one currency's rate (system admins)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams:
    get:
      operationId: listTeams
      summary: List all teams (names are visible to every authenticated user)
      description: "Returns every team as a summary. Not paginated: the response is `{items}` only."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSummaryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createTeam
      summary: Create a team (system admin only)
      description: Creates the team with `visibility=public`, `locale=en`, and makes `firstAdminUserId` its first admin (manual role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: getTeam
      summary: Team details
      description: |
        The response shape depends on the caller. System admins and members of the team receive the full
        `Team` (with an `ETag` header, the only place the version is exposed besides the `version` field).
        All other authenticated users receive a `TeamSummary` without an `ETag` header. Distinguish the
        two by the presence of `version` (only `Team` has it).
      responses:
        "200":
          description: Full team or summary
          headers:
            ETag:
              description: Present only for the full `Team` response.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Team"
                  - $ref: "#/components/schemas/TeamSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchTeam
      summary: Update team settings, or archive/unarchive (system admin)
      description: |
        Team admins (and system admins) may change `name`, `description`, `visibility`, `locale` and
        `priorityLabels`. `archived` is system-admin only and must not be combined with other fields
        (400 `invalid_request`). Archived teams reject other edits with 422 `team_archived`.
        `priorityLabels` keys must be "1" to "5"; labels are at most 200 characters; the map replaces the stored one.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTeamRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamMembers
      summary: List members (team members and system admins only)
      responses:
        "200":
          description: "OK (whole list, not paginated: `{items}` only)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addTeamMember
      summary: Grant a manual role to a user, creating the membership if needed (team admin)
      description: |
        Returns 201 when the membership was created and 200 when an existing membership was updated.
        The body has the same shape as a `GET members` item; `ETag` is the membership version.
        This endpoint does not use `If-Match`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "200":
          description: Existing membership updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "201":
          description: Membership created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: patchTeamMember
      summary: Set or clear the manual role and/or the default subgroup
      description: |
        `manualRole`: "member" or "admin" sets it, JSON `null` clears it, absent leaves it unchanged.
        Role changes are team-admin only. `defaultSubgroupId`: "" clears it; it must reference an
        active subgroup. Team admins may set it for anyone; a member may set only their own.
        Clearing the manual role of a member without an SSO role fails with 422 `member_no_role_source`.
        `If-Match` is the membership `version` (from `GET members` or the previous response).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchMemberRequest" }
      responses:
        "200":
          description: Updated member
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeTeamMember
      summary: Clear the manual role; delete the membership if no SSO role remains (team admin)
      description: |
        `If-Match` is the membership `version`. If the membership has no manual role the call fails with
        422 `member_managed_by_sso`. If an SSO role remains, the membership stays (and the call still returns 204).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/subgroups:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: addSubgroup
      summary: Add a subgroup (team admin)
      description: >-
        Returns the whole updated team. `aliases` are trimmed; empty and duplicate ones, and ones equal to the subgroup's
        own name, are dropped. Names and aliases are compared after Unicode case folding and NFC normalization. 409
        `subgroup_name_conflict` (`details.value`: the clashing name or alias) when the name or an alias equals another
        subgroup's name or alias in the team (inactive subgroups included); 422 `team_archived` for archived teams.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSubgroupRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SubgroupConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/subgroups/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - name: id
        in: path
        required: true
        description: Subgroup id (a string inside `Team.subgroups`).
        schema: { type: string }
    patch:
      operationId: patchSubgroup
      summary: Rename, edit aliases of and/or (de)activate a subgroup (team admin; subgroups are never deleted)
      description: >-
        Returns the whole updated team. `aliases` are cleaned as in `addSubgroup`; an alias equal to the subgroup's final
        name is dropped, so renaming a subgroup to one of its own aliases removes that alias. 409 `subgroup_name_conflict`
        (`details.value`: the clashing name or alias) when the name or an alias equals another subgroup's name or alias
        in the team (inactive subgroups included); 422 `team_archived` for archived teams.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchSubgroupRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SubgroupConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/role-mappings:
    get:
      operationId: listRoleMappings
      summary: List role-mapping rules (system admin only)
      responses:
        "200":
          description: "OK (whole list, not paginated: `{items}` only)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMappingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createRoleMapping
      summary: Create a UI-managed rule (system admin only)
      description: The server assigns `id` and forces `managed=false`. Validation failures use `details.fields.rule`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleMappingRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/role-mappings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putRoleMapping
      summary: Replace a UI-managed rule (system admin only)
      description: |
        Full replacement of all editable fields; omitted fields are cleared (`enabled` false, `description` empty).
        `If-Match` is the rule `version`. Managed rules fail with 422 `role_mapping_managed`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleMappingRequest" }
      responses:
        "200":
          description: Updated rule
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteRoleMapping
      summary: Delete a UI-managed rule (system admin only)
      description: "`If-Match` is the rule `version`. Managed rules fail with 422 `role_mapping_managed`."
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches:
    get:
      operationId: listBatches
      summary: List batches the caller can read, newest first
      description: |
        Cursor-paginated (spec §16.1). `nextCursor` is null on the last page. `limit` defaults to 50 and values
        above 100 clamp to 100; a non-numeric or < 1 `limit` yields 400 `invalid_request`. A malformed `teamId` or
        `cursor` yields 400 `invalid_request`. The cursor is opaque. `status` is passed through unvalidated (unknown values match nothing).
      parameters:
        - { name: teamId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BatchStatus" } }
        - { name: q, in: query, description: Free-text search., schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/batches:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: createBatch
      summary: Create a draft batch (team admin, propose=false) or propose one (any member)
      description: |
        A team admin with `propose=false` creates a `draft`; otherwise a team member creates a `proposed`
        batch. Non-members get 403. Archived teams get 422 `team_archived`. `title` is required, at most 200 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBatchRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: getBatch
      summary: Batch details (404 when the caller cannot read it)
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchBatch
      summary: Edit title, description, deadline, visibility override (team admin)
      description: |
        `deadline` and `visibilityOverride` accept an explicit JSON `null` to clear them; absent leaves
        them unchanged. While `collecting`, a changed deadline must be in the future
        (422 `deadline_not_in_future`). Closed batches (completed, cancelled, proposal_rejected) fail with
        422 `batch_closed`; archived teams with 422 `team_archived`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchBatchRequest" }
      responses:
        "200":
          description: Updated batch
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    put:
      operationId: setBatchAssignments
      summary: Replace approvers and purchasers (team admin)
      description: Approvers must be members of the batch's team; purchasers must hold the purchaser role in `users.roleSnapshot` (otherwise 400 `invalid_request` on that field). Duplicates are removed. 422 `batch_closed` / `team_archived`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentsRequest" }
      responses:
        "200":
          description: Updated batch
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    post:
      operationId: transitionBatch
      summary: Manual lifecycle action
      description: |
        Permissions: `withdraw_proposal` only by the proposer; `restore_proposal` by team admins (and the proposer for a
        withdrawn proposal); `confirm_review` / `unconfirm_review` by approvers and team admins; the rest by team admins.
        Guards: `open` (proposed/draft) needs an approver (422 `assignments_incomplete`) and a future deadline;
        `start_review` needs an approver and a pending item; `close` (collecting) moves to reviewing, or cancels the batch
        itself (`no_items`); `reopen` needs a future `deadline`; `cancel` (draft/collecting/reviewing, never after
        confirmation) and `reject_proposal` need `reason`; `uncancel` needs `reason` and, for a batch cancelled while
        collecting, a future `deadline`; it returns 409 `invalid_transition` for a withdrawn proposal (use `restore_proposal`);
        `confirm_review` needs every item approved or rejected (422 `items_undecided`) and derives the status
        (`purchaseOutside` completes the batch); `unconfirm_review` needs `reason` and is blocked (409
        `blocked_by_dependency`) while an item has a placed line or the unpurchasable mark; it removes draft vendor order
        lines of the batch's items. After confirmation the status is derived from item fulfillment.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: Updated batch
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` (stale If-Match), `invalid_transition` or `blocked_by_dependency`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/items:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: listBatchItems
      summary: List the batch's items (anyone who can read the batch)
      description: |
        Returns all items, not paginated (`{items}` only). Withdrawn items are included.
        A purchaser or receiver who cannot otherwise read the batch (spec §8.2) gets the restricted
        view of a review-confirmed batch instead: approved items only, as `PurchaserItem`; not confirmed is 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addBatchItem
      summary: Add an item (team members; proposer only while `proposed`, anyone while `collecting`)
      description: |
        While the batch is `reviewing`, only a requester who currently has a `returned` item in it and team admins may add
        (others 403); the new item starts `pending`, can only be withdrawn while the batch is `reviewing` (deletable after a return to `collecting` if never reviewed), must be
        decided before `confirm_review`, and emits `item.added_during_review` to the batch's assigned approvers (team admins if
        none; no channel message). `relatedItemId` (optional, create only) must be an item of the same batch (400 `invalid_request`).
        Other batch statuses fail with 422 `batch_not_collecting`; non-members get 403; archived teams 422 `team_archived`.
        If `subgroupId` is empty the caller's default subgroup is used when active. Field errors are 400 `invalid_request`
        (`details.fields`): name (required, max 300), quantity (>= 1), priority (1-5), purpose (required),
        estimatedUnitPrice (non-negative, supported currency, and at most the currency's minor-unit fractional digits:
        ISO 4217, or the server's BASE_CURRENCY_DECIMALS for the base currency if set), productUrl (http/https), subgroupId (active subgroup).
        `autoFilledFields` and `lookupProvider` record product-lookup provenance and are only honoured on create.
        No `If-Match`; the new item's version is in `ETag`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    post:
      operationId: reviewItems
      summary: Apply review decisions atomically (approvers and team admins, batch `reviewing`)
      description: |
        1 to 1000 decisions, no duplicate items. `return` and `reject` require a non-blank comment
        (400 `invalid_request` on `decisions`). A decision on an item that is not pending fails with
        422 `item_not_reviewable`; a batch not under review with 422 `batch_not_reviewing`.
        Review decisions never advance the batch (use `confirm_review`); `ETag` is the batch version, which every decision bumps. This endpoint does not use `If-Match`; item versions are checked internally (409 possible).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Reviewed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: putItem
      summary: Replace an item's editable fields
      description: |
        Full replacement (same validation as create); omitted optional fields are cleared. Allowed for the requester
        while the item is `pending` in a `proposed`/`collecting` batch or `returned` in a `reviewing` batch, and for
        team admins and system admins while the batch is `collecting` and the item is pending/returned. Other callers with a relation to the item get 422 `item_not_editable`; strangers 403.
        `autoFilledFields` / `lookupProvider` are accepted but ignored on update.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteItem
      summary: Delete an item that was never reviewed
      description: |
        Hard delete, no undo. Allowed only while the batch is `draft`, `proposed` or `collecting`, the item is `pending` and
        `firstReviewedAt` is null (else 422 `item_not_deletable`; withdraw the item instead). The requester may delete their own
        item; team admins and system admins any item. Audit records `item.deleted` with the pre-delete content in `changes`.
        No request body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: withdrawItem
      summary: Withdraw an item (same permission rule as editing)
      description: 422 `item_not_editable` when the caller is related to the item but it can no longer be withdrawn. No request body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/resubmit:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: resubmitItem
      summary: Send a returned item back to review (requester only)
      description: |
        Requires a `returned` item in a `reviewing` batch (else 409 `invalid_transition`), and either that the item was edited after
        it was returned (`item.version` greater than `item.review.atVersion`) or a non-blank `resubmitNote` (else 422
        `item_not_edited`). The body is optional; the note is stored on the item and shown to approvers.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResubmitRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `invalid_transition`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/force-reject:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: forceRejectItem
      summary: Reject a pending or returned item during review (team admin)
      description: Requires the batch to be `reviewing` (422 `batch_not_reviewing`) and a non-blank `reason` (400 `invalid_request`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForceRejectRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `invalid_transition`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/unpurchasable:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: markItemUnpurchasable
      summary: Mark an approved item unpurchasable, or "do not buy the remaining quantity" (purchasers)
      description: |
        Requires a non-blank `reason`. The item must be `approved` in a review-confirmed batch that is not purchased outside
        (409 `invalid_transition`) and have no draft vendor order lines (409 `blocked_by_dependency`). With placed lines the
        mark means the remaining quantity is not bought. The batch status is re-derived in the same transaction.
        System admins have no implicit purchaser role (403).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnpurchasableRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `invalid_transition`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/unpurchasable/undo:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: undoItemUnpurchasable
      summary: Remove the unpurchasable mark (purchasers)
      description: Requires `reason`. Restores the remaining quantity to the queue.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnpurchasableRequest" }
      responses:
        "200":
          description: Item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict`, `invalid_transition` or `blocked_by_dependency`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/review/undo:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: undoItemReview
      summary: Undo a review decision, including force-reject
      description: Requires `reason`. Allowed to the reviewer who decided and to team admins, only while the batch is not review-confirmed (otherwise 409 `blocked_by_dependency`). The item returns to `pending` and `review` is cleared.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnpurchasableRequest" }
      responses:
        "200":
          description: Item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict`, `invalid_transition` or `blocked_by_dependency`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: copyItem
      summary: Copy a withdrawn item into a new pending item of the same batch
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      description: Allowed to the requester and team admins while the batch accepts items (422 `batch_not_collecting` otherwise). Takes no body; `If-Match` carries the withdrawn item's version (428 `if_match_required`, 409 `version_conflict`).
      responses:
        "201":
          description: Item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict`, `invalid_transition` or `blocked_by_dependency`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/tasks:
    get:
      operationId: getMyTasks
      summary: Work waiting for the caller
      description: |
        Everyone gets `proposalsToHandle`, `itemsToReview`, `returnedItems` and `reviewsToConfirm` (reviewing batches where the
        caller is an approver and every item is decided). Purchasers also get `itemsToPurchase` (approved items with remaining
        quantity, grouped by vendor name; `vendor` null for items without one; `myBatches` counts those in batches where the
        caller is the assigned purchaser), `draftVendorOrders`, `openProblems`, `linesToClose`; purchasers and receivers get
        `deliveriesToMatch` (delivery lines that are unmatched or partial); `openProblems` counts unresolved problems.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTasks" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /audit:
    get:
      operationId: getAudit
      summary: Timeline of a batch (including its items' events), an item, a vendor order or a delivery (purchasers, receivers and system admins; 404 for others)
      description: Cursor-paginated, oldest event first by default; `order=desc` returns the newest first (the cursor then continues toward older events). Anyone who can read the object may read it; vendor order events are filtered per line and order-level money changes summarised for regular users (spec 8.2). A malformed `objectId` yields 404; any other `objectType` yields 400; a bad `limit` or `order` 400 `invalid_request`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: objectType, in: query, required: true, schema: { type: string, enum: [batch, item, vendor_order, delivery] } }
        - { name: objectId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/audit:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: getTeamAudit
      summary: Team-wide audit log (team admins and system admins)
      description: Cursor-paginated, newest event first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /purchasing/queue:
    get:
      operationId: getPurchasingQueue
      summary: "Purchasing queue: approved items with quantity still to purchase (purchasers)"
      description: |
        Items of review-confirmed batches (not purchased outside) with `toPurchaseQuantity > 0`, grouped by vendor (`vendorId` null is the
        "other" group, last). Each item carries the quantity already in draft lines (`draftQuantity`) and the placed quantity (`orderedQuantity`).
        Purchasers only (403 otherwise). Not paginated.
      parameters:
        - { name: vendorId, in: query, schema: { type: string } }
        - { name: teamId, in: query, schema: { type: string } }
        - { name: batchId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchasingQueue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-orders:
    get:
      operationId: listVendorOrders
      summary: "List the vendor orders the caller can see (cursor-paginated)"
      description: |
        Purchasers, receivers and system admins see every order; regular users only orders with at least one line of their teams or of a
        batch they can read (`restricted: true`, line count and amounts limited to visible lines). `q` matches `VO-<n>`, `<n>` or the vendor's order number.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, placed, cancelled] } }
        - { name: vendorId, in: query, schema: { type: string } }
        - { name: teamId, in: query, schema: { type: string } }
        - { name: ownerId, in: query, description: "A user id, or `me` for the caller: only orders that list that user as an owner.", schema: { type: string } }
        - { name: completed, in: query, description: "`false`: placed orders that are not completed yet; `true`: completed ones (spec 10.3). Drafts and cancelled orders match neither.", schema: { type: boolean } }
        - { name: receivingState, in: query, schema: { $ref: "#/components/schemas/ReceivingState" } }
        - { name: accountingState, in: query, schema: { $ref: "#/components/schemas/AccountingState" } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrderPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createVendorOrder
      summary: "Create a draft vendor order, optionally with one line per item (purchasers)"
      description: |
        The currency defaults to the vendor's default currency. Each item must be approved in a review-confirmed batch that is not purchased
        outside and not marked unpurchasable (422 `item_not_purchasable`); the line quantity defaults to the item's remaining quantity.
        Takes no `If-Match`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorOrderRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-orders/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getVendorOrder
      summary: "Get a vendor order as the caller may see it"
      description: |
        Regular users get only the lines they can see (404 when none); order-level money is limited to amounts allocated to those lines
        and the rest is aggregated in `otherTeams` (spec 8.2). `invariantOk` (purchasers, receivers, system admins) is the check
        `netBase == sum of line totalBase`. The `ETag` is the vendor order version used by every order, line and cost entry write.
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putVendorOrder
      summary: "Replace the editable fields of a vendor order (purchasers)"
      description: |
        Replaces every editable field; omitted ones are cleared. `vendorId` and `currency` only change while the order is a draft (422 `order_locked`).
        Money other than the goods lives in cost entries, not here. Recomputes amounts, items and batch status in the same transaction.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorOrderRequest" }
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-orders/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: addVendorOrderLine
      summary: "Add a line to a draft order (purchasers)"
      description: |
        Give exactly one of `itemId` (the line is linked to the item: team, name, SKU and quantity default from it; 422 `item_not_purchasable`,
        `item_already_on_order`) or `teamId` (a standalone line, `name` required). Only while the order is a draft (422 `order_not_draft`).
        `If-Match` is the vendor order version. Returns the updated order; `allocationsReset` is true when cost entries whose teams or lines disappeared went back to `all`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLineRequest" }
      responses:
        "201":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-order-lines:
    get:
      operationId: listVendorOrderLinesToClose
      summary: "Lines waiting for a close decision (purchasers, system admins)"
      description: |
        `toClose=true` is required: placed, unclosed lines with received quantity above 0 and below the expected quantity and no open problem.
        Rows carry `vendorOrderVersion` for `If-Match`.
      parameters:
        - { name: toClose, in: query, required: true, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrderLineList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-order-lines/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: putVendorOrderLine
      summary: "Replace the editable fields of a line (purchasers)"
      description: |
        After the order is placed only `unitPrice` (never back to null: 422 `unit_price_required`), `name` and `sku` may change;
        quantity and team are locked (422 `line_locked`). `If-Match` is the vendor order version. Returns the updated order.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceLineRequest" }
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteVendorOrderLine
      summary: "Remove a line from a draft order (purchasers)"
      description: |
        Only while the order is a draft. `If-Match` is the vendor order version. Returns the updated order.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-order-lines/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: closeVendorOrderLine
      summary: "Close the remaining quantity of a short line (purchasers)"
      description: |
        `short_accepted` (the vendor shipped less, stop chasing) or `not_obtained` (cancel the rest). Only lines that received less than expected
        and have no open problem (422 `line_not_closable`). An optional `refund` (positive `amount`) is stored as a negative `refund` cost entry (separate, source `closure`) allocated to the line. `If-Match` is the vendor order version.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseLineRequest" }
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-order-lines/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: reopenVendorOrderLine
      summary: "Undo a line closure (purchasers)"
      description: |
        The closure's refund entry is voided. `If-Match` is the vendor order version.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-orders/{id}/place:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: placeVendorOrder
      summary: "Mark the order as placed at the vendor (purchasers)"
      description: |
        Needs at least one line, a unit price on every line (422 `line_missing_price`), valid team cost overrides, and every linked item still approved,
        in a review-confirmed batch that is not purchased outside, and not unpurchasable (422 `item_not_purchasable`).  Takes no body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-orders/{id}/cost-entries:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: createCostEntry
      summary: "Add a cost entry to a vendor order (purchasers)"
      description: |
        Shipping, fees, taxes, discounts, coupons used, refunds, extra charges and other adjustments. `refund` and `extra_charge` only after the order is placed
        (422 `order_not_placed`); other types also in draft. Invalid signs, currencies or fields yield 400; an allocation that does not fit yields 422 `shared_cost_allocation_invalid`.
        `If-Match` is the vendor order version. Returns the updated order.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostEntryRequest" }
      responses:
        "201":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /cost-entries/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: putCostEntry
      summary: "Replace a cost entry (purchasers)"
      description: |
        Replaces every editable field, in a draft or after placing (audited, amounts recomputed). A voided entry cannot be edited (422 `cost_entry_voided`).
        `If-Match` is the vendor order version.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostEntryRequest" }
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteCostEntry
      summary: "Delete a cost entry of a draft order (purchasers)"
      description: |
        Only while the order is a draft (422 `order_not_draft`); after placing, void the entry instead. `If-Match` is the vendor order version.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated order
          headers:
