    put:
      operationId: setDeliveryLineMatches
      summary: "Set the matches of a delivery line (diffed by vendorOrderLineId, all or nothing)"
      description: |
        Same quantities are kept, changed ones are voided and recreated, missing ones voided. 422 `line_quantity_exceeded` (`details.remaining`) when a line cannot take the quantity,
        422 `line_not_matchable` for lines that are not on a placed order or are closed, 409 `blocked_by_dependency` when voiding a match is blocked by a resolved problem or a closure.
