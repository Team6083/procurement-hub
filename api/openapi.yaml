openapi: 3.1.0
info:
  title: procurement-hub API
  version: 0.1.0
  description: |
    Common headers. Every response carries `X-App-Version`, `X-App-Commit`, `X-Request-ID` and
    `X-Content-Type-Options: nosniff`. Clients may send `X-Request-ID` (1–128 characters from
    `A-Z a-z 0-9 - _ . :`) to correlate a request with server logs; the server echoes it, or generates an id
    when it is missing or invalid. Error responses document `X-Request-ID` explicitly; quote it when
    reporting a problem.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Deployment metadata (unauthenticated)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /me:
    get:
      operationId: getMe
      summary: Current user profile, memberships and system-admin flag
      description: The `ETag` header (and `version` field) is the value to send in `If-Match` on `PATCH /me`.
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchMe
      summary: Update locale and/or notification preferences
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchMeRequest" }
      responses:
        "200":
          description: Updated profile
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /users:
    get:
      operationId: searchUsers
      summary: Search users who have logged in at least once
      description: |
        Only system admins and members of at least one team may search (otherwise 403).
        `q` must contain at least 2 characters after trimming (otherwise 400 `invalid_request`).
        At most 20 users are returned. Not paginated: the response is `{items}` only.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams:
    get:
      operationId: listTeams
      summary: List all teams (names are visible to every authenticated user)
      description: "Returns every team as a summary. Not paginated: the response is `{items}` only."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSummaryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createTeam
      summary: Create a team (system admin only)
      description: Creates the team with `visibility=public`, `locale=en`, and makes `firstAdminUserId` its first admin (manual role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: getTeam
      summary: Team details
      description: |
        The response shape depends on the caller. System admins and members of the team receive the full
        `Team` (with an `ETag` header, the only place the version is exposed besides the `version` field).
        All other authenticated users receive a `TeamSummary` without an `ETag` header. Distinguish the
        two by the presence of `version` (only `Team` has it).
      responses:
        "200":
          description: Full team or summary
          headers:
            ETag:
              description: Present only for the full `Team` response.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Team"
                  - $ref: "#/components/schemas/TeamSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchTeam
      summary: Update team settings, or archive/unarchive (system admin)
      description: |
        Team admins (and system admins) may change `name`, `description`, `visibility`, `locale` and
        `priorityLabels`. `archived` is system-admin only and must not be combined with other fields
        (400 `invalid_request`). Archived teams reject other edits with 422 `team_archived`.
        `priorityLabels` keys must be "1" to "5"; labels are at most 200 characters; the map replaces the stored one.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTeamRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamMembers
      summary: List members (team members and system admins only)
      responses:
        "200":
          description: "OK (whole list, not paginated: `{items}` only)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addTeamMember
      summary: Grant a manual role to a user, creating the membership if needed (team admin)
      description: |
        Returns 201 when the membership was created and 200 when an existing membership was updated.
        The body has the same shape as a `GET members` item; `ETag` is the membership version.
        This endpoint does not use `If-Match`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "200":
          description: Existing membership updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "201":
          description: Membership created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: patchTeamMember
      summary: Set or clear the manual role and/or the default subgroup
      description: |
        `manualRole`: "member" or "admin" sets it, JSON `null` clears it, absent leaves it unchanged.
        Role changes are team-admin only. `defaultSubgroupId`: "" clears it; it must reference an
        active subgroup. Team admins may set it for anyone; a member may set only their own.
        Clearing the manual role of a member without an SSO role fails with 422 `member_no_role_source`.
        `If-Match` is the membership `version` (from `GET members` or the previous response).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchMemberRequest" }
      responses:
        "200":
          description: Updated member
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeTeamMember
      summary: Clear the manual role; delete the membership if no SSO role remains (team admin)
      description: |
        `If-Match` is the membership `version`. If the membership has no manual role the call fails with
        422 `member_managed_by_sso`. If an SSO role remains, the membership stays (and the call still returns 204).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/subgroups:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: addSubgroup
      summary: Add a subgroup (team admin)
      description: Returns the whole updated team. 422 `subgroup_exists` when the name exists (case-insensitive); 422 `team_archived` for archived teams.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSubgroupRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/subgroups/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - name: id
        in: path
        required: true
        description: Subgroup id (a string inside `Team.subgroups`).
        schema: { type: string }
    patch:
      operationId: patchSubgroup
      summary: Rename and/or (de)activate a subgroup (team admin; subgroups are never deleted)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchSubgroupRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/reference-rates:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    put:
      operationId: replaceReferenceRates
      summary: Replace the team's reference rate list (team admin)
      description: |
        Currencies are upper-cased, must be supported (see `/meta`), unique, and must not be the base
        currency. `rateToBase` is a decimal string > 0 with at most 6 fractional digits (400 `invalid_request`, field `rateToBase`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutReferenceRatesRequest" }
      responses:
        "200":
          description: Updated team
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/role-mappings:
    get:
      operationId: listRoleMappings
      summary: List role-mapping rules (system admin only)
      responses:
        "200":
          description: "OK (whole list, not paginated: `{items}` only)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMappingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createRoleMapping
      summary: Create a UI-managed rule (system admin only)
      description: The server assigns `id` and forces `managed=false`. Validation failures use `details.fields.rule`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleMappingRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/role-mappings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putRoleMapping
      summary: Replace a UI-managed rule (system admin only)
      description: |
        Full replacement of all editable fields; omitted fields are cleared (`enabled` false, `description` empty).
        `If-Match` is the rule `version`. Managed rules fail with 422 `role_mapping_managed`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleMappingRequest" }
      responses:
        "200":
          description: Updated rule
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteRoleMapping
      summary: Delete a UI-managed rule (system admin only)
      description: "`If-Match` is the rule `version`. Managed rules fail with 422 `role_mapping_managed`."
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches:
    get:
      operationId: listBatches
      summary: List batches the caller can read, newest first
      description: |
        Cursor-paginated (spec §16.1). `nextCursor` is null on the last page. `limit` defaults to 50 and values
        above 100 clamp to 100; a non-numeric or < 1 `limit` yields 400 `invalid_request`. A malformed `teamId` or
        `cursor` yields 400 `invalid_request`. The cursor is opaque. `status` is passed through unvalidated (unknown values match nothing).
      parameters:
        - { name: teamId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BatchStatus" } }
        - { name: q, in: query, description: Free-text search., schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/batches:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: createBatch
      summary: Create a draft batch (team admin, propose=false) or propose one (any member)
      description: |
        A team admin with `propose=false` creates a `draft`; otherwise a team member creates a `proposed`
        batch. Non-members get 403. Archived teams get 422 `team_archived`. `title` is required, at most 200 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBatchRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: getBatch
      summary: Batch details (404 when the caller cannot read it)
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchBatch
      summary: Edit title, description, deadline, visibility override (team admin)
      description: |
        `deadline` and `visibilityOverride` accept an explicit JSON `null` to clear them; absent leaves
        them unchanged. While `collecting`, a changed deadline must be in the future
        (422 `deadline_not_in_future`). Closed batches (completed, cancelled, proposal_rejected) fail with
        422 `batch_closed`; archived teams with 422 `team_archived`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchBatchRequest" }
      responses:
        "200":
          description: Updated batch
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    put:
      operationId: setBatchAssignments
      summary: Replace approvers, purchasers and receivers (team admin)
      description: Every assignee must be a member of the batch's team (otherwise 400 `invalid_request` on that field). Duplicates are removed. 422 `batch_closed` / `team_archived`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentsRequest" }
      responses:
        "200":
          description: Updated batch
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    post:
      operationId: transitionBatch
      summary: Manual lifecycle action
      description: |
        Permissions: `withdraw_proposal` only by the proposer (batch origin `proposed`, `createdBy` = caller);
        every other action by team admins and system admins. Guards:
        `open` (from proposed/draft) needs complete assignments (422 `assignments_incomplete`) and a future
        deadline, taken from the body or else the batch (`deadline_required`, `deadline_not_in_future`);
        `start_review` (proposed/draft) needs complete assignments and at least one pending item (`no_pending_items`);
        `close` (collecting) moves to reviewing, or cancels the batch itself when no pending/returned items exist;
        `reopen` (reviewing) needs a future `deadline`;
        `cancel` (draft/collecting/reviewing) needs `reason` (`reason_required`);
        `reject_proposal` (proposed) needs `reason`;
        `withdraw_proposal` (proposed). A wrong source state yields 409 `invalid_transition`.
        The batch may also advance automatically (reviewing -> ordering/completed) after the action; the response is the final state.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: Updated batch
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` (stale If-Match) or `invalid_transition` (action not allowed in the current status)."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/items:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: listBatchItems
      summary: List the batch's items (anyone who can read the batch)
      description: "Returns all items, not paginated (`{items}` only). Withdrawn items are included."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addBatchItem
      summary: Add an item (team members; proposer only while `proposed`, anyone while `collecting`)
      description: |
        Other batch statuses fail with 422 `batch_not_collecting`; non-members get 403; archived teams 422 `team_archived`.
        If `subgroupId` is empty the caller's default subgroup is used when active. Field errors are 400 `invalid_request`
        (`details.fields`): name (required, max 300), quantity (>= 1), priority (1-5), purpose (required),
        estimatedUnitPrice (non-negative, supported currency, and at most the currency's minor-unit fractional digits:
        ISO 4217, or the server's BASE_CURRENCY_DECIMALS for the base currency if set), productUrl (http/https), subgroupId (active subgroup).
        `autoFilledFields` and `lookupProvider` record product-lookup provenance and are only honoured on create.
        No `If-Match`; the new item's version is in `ETag`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    post:
      operationId: reviewItems
      summary: Apply review decisions atomically (approvers and team admins, batch `reviewing`)
      description: |
        1 to 1000 decisions, no duplicate items. `return` and `reject` require a non-blank comment
        (400 `invalid_request` on `decisions`). A decision on an item that is not pending fails with
        422 `item_not_reviewable`; a batch not under review with 422 `batch_not_reviewing`.
        The batch may advance automatically (e.g. to `ordering`); the returned batch is the final state and
        `ETag` is its version. This endpoint does not use `If-Match`; item versions are checked internally (409 possible).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Reviewed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: putItem
      summary: Replace an item's editable fields
      description: |
        Full replacement (same validation as create); omitted optional fields are cleared. Allowed for the requester
        while the item is `pending` in a `proposed`/`collecting` batch or `returned` in a `reviewing` batch, and for
        team admins and system admins while the batch is `collecting` and the item is pending/returned. Other callers with a relation to the item get 422 `item_not_editable`; strangers 403.
        `autoFilledFields` / `lookupProvider` are accepted but ignored on update.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: withdrawItem
      summary: Withdraw an item (same permission rule as editing)
      description: 422 `item_not_editable` when the caller is related to the item but it can no longer be withdrawn. No request body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/resubmit:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: resubmitItem
      summary: Send a returned item back to review (requester only)
      description: |
        Requires a `returned` item in a `reviewing` batch (else 409 `invalid_transition`), and that the item was edited after it was returned
        (`item.updatedAt` after `item.review.at`, else 422 `item_not_edited`). No request body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `invalid_transition`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/force-reject:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: forceRejectItem
      summary: Reject a pending or returned item during review (team admin)
      description: Requires the batch to be `reviewing` (422 `batch_not_reviewing`) and a non-blank `reason` (400 `invalid_request`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForceRejectRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `invalid_transition`."
          headers:
