  /deliveries:
    get:
      operationId: listDeliveries
      summary: "List deliveries (purchasers, receivers, system admins; 404 for others)"
      description: Cursor-paginated, newest first. `q` matches `DL-<n>`, the source or the note; `from`/`to` bound `receivedAt`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: voided, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
