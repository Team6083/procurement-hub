      properties:
        id: { type: string }
        deliveryId: { type: string }
        lineNo: { type: integer }
        name: { type: string }
        sku: { type: string }
        goodQuantity: { type: integer }
        problemQuantity: { type: integer }
        problemType: { type: string, enum: [damaged, wrong_item, ""] }
        problemNote: { type: string }
        noMatch:
          oneOf:
            - type: object
              required: [reason, by, at]
              properties:
                reason: { type: string }
                by: { type: string }
                at: { type: string, format: date-time }
            - { type: "null" }
        matchState: { $ref: "#/components/schemas/MatchState" }
        deliveryNumber: { type: integer }
        deliveryVersion: { type: integer, format: int64, description: The delivery version to send in If-Match. }
        receivedAt: { type: string, format: date }
        source: { type: string }
        matches: { type: array, items: { $ref: "#/components/schemas/MatchView" } }
        matchedGoodQuantity: { type: integer }
        matchedProblemQuantity: { type: integer }
    DeliveryLineList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DeliveryLine" } }
    Delivery:
      type: object
      required: [id, number, receivedAt, source, note, voided, createdBy, createdAt, updatedAt, version, lines]
      properties:
        id: { type: string }
        number: { type: integer, description: "Displayed as DL-<number>." }
        receivedAt: { type: string, format: date }
        source: { type: string }
        note: { type: string }
        voided:
          oneOf:
            - { $ref: "#/components/schemas/VoidInfo" }
            - { type: "null" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        lines: { type: array, items: { $ref: "#/components/schemas/DeliveryLine" } }
    DeliverySummary:
      type: object
      required: [id, number, receivedAt, source, note, voided, createdBy, createdAt, updatedAt, version, lineCount, pendingLineCount]
      properties:
        id: { type: string }
        number: { type: integer }
        receivedAt: { type: string, format: date }
        source: { type: string }
        note: { type: string }
        voided:
          oneOf:
            - { $ref: "#/components/schemas/VoidInfo" }
            - { type: "null" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        lineCount: { type: integer }
        pendingLineCount: { type: integer }
    DeliveryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DeliverySummary" } }
        nextCursor: { type: [string, "null"] }
    MatchRequest:
      type: object
      additionalProperties: false
      required: [vendorOrderLineId, goodQuantity, problemQuantity]
      properties:
        vendorOrderLineId: { type: string }
        goodQuantity: { type: integer, minimum: 0 }
        problemQuantity: { type: integer, minimum: 0 }
    SetMatchesRequest:
      type: object
      additionalProperties: false
      required: [matches]
      properties:
        matches: { type: array, items: { $ref: "#/components/schemas/MatchRequest" } }
    DeliveryLineRequest:
      type: object
      additionalProperties: false
      required: [goodQuantity]
      properties:
        name: { type: string }
        sku: { type: string }
        goodQuantity: { type: integer, minimum: 0 }
        problemQuantity: { type: integer, minimum: 0 }
        problemType: { type: string, enum: [damaged, wrong_item, ""], description: Required when `problemQuantity` > 0. }
        problemNote: { type: string }
        matches: { type: array, items: { $ref: "#/components/schemas/MatchRequest" } }
    CreateDeliveryRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        receivedAt: { type: string, format: date, description: Defaults to today (UTC). }
        source: { type: string }
        note: { type: string }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/DeliveryLineRequest" } }
    Candidate:
      type: object
      required: [vendorOrderLineId, vendorOrderId, vendorOrderNumber, vendorName, placedAt, lineNo, name, sku, quantity, receivedQuantity, capacity, matchedBy, score, suggestedGoodQuantity, suggestedProblemQuantity]
      properties:
        vendorOrderLineId: { type: string }
        vendorOrderId: { type: string }
        vendorOrderNumber: { type: integer }
        vendorName: { type: string }
        placedAt: { type: [string, "null"], format: date-time }
        lineNo: { type: integer }
        name: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        receivedQuantity: { type: integer }
        capacity: { type: integer, description: How many more units the line can take. }
        matchedBy: { type: string, enum: [sku, name] }
        score: { type: number }
        suggestedGoodQuantity: { type: integer }
        suggestedProblemQuantity: { type: integer }
    CandidateList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
    Problem:
      type: object
      required: [id, vendorOrderLineId, deliveryMatchId, quantity, type, note, resolution, voided, createdAt, updatedAt, version, vendorOrderId, vendorOrderNumber, lineNo, lineName, teamId, deliveryId, deliveryNumber]
      properties:
        id: { type: string }
        vendorOrderLineId: { type: string }
        deliveryMatchId: { type: [string, "null"] }
        quantity: { type: integer }
        type: { type: string, enum: [damaged, wrong_item] }
        note: { type: string }
        resolution:
          oneOf:
            - type: object
              required: [action, refundEntryId, note, by, at]
              properties:
                action: { type: string, enum: [exchange, return_no_replace, accept] }
                refundEntryId: { type: [string, "null"] }
                note: { type: string }
                by: { type: string }
                at: { type: string, format: date-time }
            - { type: "null" }
        voided:
          oneOf:
            - { $ref: "#/components/schemas/VoidInfo" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, description: The problem version to send in If-Match. }
        vendorOrderId: { type: string }
        vendorOrderNumber: { type: integer }
        lineNo: { type: integer }
        lineName: { type: string }
        teamId: { type: string }
        deliveryId: { type: [string, "null"] }
        deliveryNumber: { type: [integer, "null"] }
    ProblemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Problem" } }
    ResolveProblemRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [exchange, return_no_replace, accept] }
        refund: { anyOf: [{ $ref: "#/components/schemas/RefundInput" }, { type: "null" }], description: "Only with return_no_replace; any other action yields 400." }
        note: { type: string }
