        currency: { type: string, description: Set for entry_no_conversion. }
    OrderTotals:
      type: object
      required: [linesC, checkoutC, originalC, factor, targetBase, separateBase, netBase, provisional, incomplete]
      properties:
        linesC: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        checkoutC: { type: [string, "null"], description: "Decimal string; sum of the with_checkout cost entries (order currency)." }
        originalC: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        factor: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        targetBase: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        separateBase: { type: [string, "null"], description: "Decimal string; base-currency sum of the separate cost entries; null when it cannot be computed." }
        netBase: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        provisional: { type: boolean, description: True when a reference rate stands in for a real amount. }
        incomplete: { type: array, items: { $ref: "#/components/schemas/Incomplete" } }
    LineStatus:
      type: string
      enum: [cancelled, draft, short_accepted, not_obtained, received, partially_received, ordered]
    LineClosure:
      type: object
      required: [type, reason, refundEntryId, by, at]
      properties:
        type: { type: string, enum: [short_accepted, not_obtained] }
        reason: { type: string }
        refundEntryId: { type: [string, "null"] }
        by: { type: string }
        at: { type: string, format: date-time }
    ProblemSummary:
      type: object
      required: [id, quantity, type, resolution]
      properties:
        id: { type: string }
        quantity: { type: integer }
        type: { type: string, enum: [damaged, wrong_item] }
        resolution: { type: [string, "null"], enum: [exchange, return_no_replace, accept, null] }
        version: { type: integer, format: int64, description: "Purchasers, receivers and system admins only; the problem version for If-Match." }
        deliveryId: { type: string, description: "Purchasers, receivers and system admins only." }
        note: { type: string, description: "Purchasers, receivers and system admins only." }
    PersonRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
    OwnerRef:
      type: object
      required: [id, displayName, isPurchaser]
      properties:
        id: { type: string }
        displayName: { type: string }
        isPurchaser: { type: boolean, description: "From users.roleSnapshot; false for an owner who lost the purchaser role." }
    VendorOrderLine:
      type: object
      required: [requester, id, vendorOrderId, lineNo, teamId, itemId, batchId, name, sku, productUrl, quantity, unitPrice, returnedQuantity, expectedQuantity, receivedQuantity, openProblemQuantity, closure, status, cost, shared, costBase, sharedBase, separateBase, totalBase, createdAt, updatedAt, vendorOrderVersion, vendorOrderNumber, problems]
      properties:
        id: { type: string }
        vendorOrderId: { type: string }
        lineNo: { type: integer }
        teamId: { type: string, description: Cost attribution team. }
        itemId: { type: [string, "null"] }
        requester: { oneOf: [{ $ref: "#/components/schemas/PersonRef" }, { type: "null" }], description: "The linked item's requester; null without an item. Only present on lines the caller can see." }
        batchId: { type: [string, "null"] }
        name: { type: string }
        sku: { type: string }
        productUrl: { type: string, description: "The linked item's current product URL (http/https), read when the order is fetched; empty when the line has no item or the item has no URL. Read-only." }
        estimatedUnitPrice: { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "The linked item's current estimated unit price; null when the line has no item. Read-only." }
        quantity: { type: integer }
        unitPrice: { type: [string, "null"], description: Decimal string in the order currency. }
        returnedQuantity: { type: integer }
        expectedQuantity: { type: integer }
        receivedQuantity: { type: integer }
        openProblemQuantity: { type: integer }
        closure: { oneOf: [{ $ref: "#/components/schemas/LineClosure" }, { type: "null" }] }
        status: { $ref: "#/components/schemas/LineStatus" }
        cost: { type: [string, "null"], description: Decimal string in the order currency; quantity x unitPrice; null when unitPrice is null. }
        shared: { type: [string, "null"], description: "Decimal string in the order currency; the with_checkout cost entries allocated to this line, rounded to the currency's minor unit so the lines add up to the order's checkoutC; null when it cannot be computed." }
        costBase: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        sharedBase: { type: [string, "null"], description: "Decimal string; the with_checkout cost entries allocated to this line; null when it cannot be computed." }
        separateBase: { type: [string, "null"], description: "Decimal string; the separate payments and refunds allocated to this line; null when it cannot be computed." }
        totalBase: { type: [string, "null"], description: Decimal string; null when it cannot be computed. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        vendorOrderVersion: { type: integer, format: int64, description: The vendor order version to send in If-Match. }
        vendorOrderNumber: { type: integer }
        problems: { type: array, items: { $ref: "#/components/schemas/ProblemSummary" } }
    VendorOrderLineList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VendorOrderLine" } }
    CostAllocation:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [all, teams, lines, manual] }
        teamIds: { type: array, items: { type: string } }
        lineIds: { type: array, items: { type: string } }
        amounts:
          type: array
          description: In the entry currency; must add up to the entry amount.
          items:
            type: object
            required: [lineId, amount]
            properties:
              lineId: { type: string }
              amount: { type: string }
    CostEntry:
      type: object
      required: [id, vendorOrderId, type, settlement, currency, amount, actualAmountBase, refundMethod, allocation, note, source, sourceId, voided, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        vendorOrderId: { type: string }
        type: { type: string, enum: [shipping, fee, tax, discount, coupon_used, refund, extra_charge, other] }
        settlement: { type: string, enum: [with_checkout, separate] }
        currency: { type: string }
        amount: { type: string, description: "Decimal string, non-zero; negative for discounts and refunds." }
        actualAmountBase: { type: [string, "null"], description: "Separate entries only: the real base-currency amount, same sign as amount." }
        refundMethod: { type: [string, "null"], enum: [cash, coupon, null] }
        allocation: { $ref: "#/components/schemas/CostAllocation" }
        note: { type: string }
        source: { type: string, enum: [manual, problem, closure] }
        sourceId: { type: [string, "null"] }
        voided:
          oneOf:
            - type: object
              required: [reason, by, at]
              properties:
                reason: { type: string }
                by: { type: string }
                at: { type: string, format: date-time }
            - { type: "null" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    OtherTeams:
      type: object
      required: [lines, totalBase]
      properties:
        lines: { type: integer }
        totalBase: { type: [string, "null"] }
    VendorOrder:
      type: object
      required: [id, number, vendorId, currency, status, owners, externalOrderNo, placedAt, placedBy, chargedAmountBase, expectedDeliveryDate, paymentNote, teamIds, batchIds, totals, receivingState, accountingState, completed, cancellation, createdBy, createdAt, updatedAt, version, vendorName, lines, costEntries, restricted, otherTeams, visibleTotalBase, invariantOk]
      properties:
        id: { type: string }
        number: { type: integer, description: "Displayed as VO-<number>." }
        vendorId: { type: string }
        vendorName: { type: string }
        currency: { type: string }
        status: { type: string, enum: [draft, placed, cancelled] }
        owners: { type: array, items: { $ref: "#/components/schemas/OwnerRef" }, description: "Owners. Only drive notifications and the tasks list; they grant no permission. isPurchaser comes from users.roleSnapshot." }
        externalOrderNo: { type: string }
        placedAt: { type: [string, "null"], format: date-time }
        placedBy: { type: [string, "null"] }
        chargedAmountBase: { type: [string, "null"], description: Decimal string in the base currency. }
        expectedDeliveryDate: { type: string, description: "YYYY-MM-DD or empty." }
        paymentNote: { type: string }
        teamIds: { type: array, items: { type: string } }
        batchIds: { type: array, items: { type: string } }
        totals: { $ref: "#/components/schemas/OrderTotals" }
        receivingState: { oneOf: [{ $ref: "#/components/schemas/ReceivingState" }, { type: "null" }], description: "Computed; null for draft and cancelled orders." }
        accountingState: { oneOf: [{ $ref: "#/components/schemas/AccountingState" }, { type: "null" }] }
        completed: { type: [boolean, "null"], description: "receivingState is closed and accountingState is final. Computed, never set by hand." }
        cancellation:
          oneOf:
            - type: object
              required: [reason, by, at]
              properties:
                reason: { type: string }
                by: { type: string }
                at: { type: string, format: date-time }
            - { type: "null" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        lines: { type: array, items: { $ref: "#/components/schemas/VendorOrderLine" } }
        costEntries: { type: array, items: { $ref: "#/components/schemas/CostEntry" }, description: "Purchasers, receivers and system admins; regular users get an empty list (their lines carry the allocated amounts)." }
        restricted: { type: boolean, description: True for regular users (spec 8.2); money fields then cover visible lines only. }
        otherTeams: { oneOf: [{ $ref: "#/components/schemas/OtherTeams" }, { type: "null" }] }
        visibleTotalBase: { type: [string, "null"], description: Regular users only. }
        invariantOk: { type: [boolean, "null"], description: "Purchasers, receivers and system admins: netBase equals the sum of line totals (null when not computable)." }
        allocationsReset: { type: boolean, description: "True when this write reset cost entries whose teams or lines disappeared to `all`." }
    VendorOrderSummary:
      type: object
      required: [id, number, vendorId, vendorName, currency, status, owners, externalOrderNo, placedAt, expectedDeliveryDate, lineCount, teamIds, netBase, provisional, incomplete, receivingState, accountingState, completed, restricted, createdAt, version]
      properties:
        id: { type: string }
        number: { type: integer }
        vendorId: { type: string }
        vendorName: { type: string }
        currency: { type: string }
        status: { type: string, enum: [draft, placed, cancelled] }
        owners: { type: array, items: { $ref: "#/components/schemas/OwnerRef" } }
        externalOrderNo: { type: string }
        placedAt: { type: [string, "null"], format: date-time }
        expectedDeliveryDate: { type: string }
        lineCount: { type: integer }
        teamIds: { type: array, items: { type: string } }
        netBase: { type: [string, "null"] }
        provisional: { type: boolean }
        incomplete: { type: array, items: { $ref: "#/components/schemas/Incomplete" } }
        receivingState: { oneOf: [{ $ref: "#/components/schemas/ReceivingState" }, { type: "null" }] }
        accountingState: { oneOf: [{ $ref: "#/components/schemas/AccountingState" }, { type: "null" }] }
        completed: { type: [boolean, "null"] }
        restricted: { type: boolean }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ReceivingState: { type: string, enum: [none, partial, closed] }
    AccountingState: { type: string, enum: [incomplete, provisional, final] }
    VendorOrderPage:
      type: object
