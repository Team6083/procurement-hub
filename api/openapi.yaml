        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /items/{id}/unpurchasable:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: markItemUnpurchasable
      summary: Close an approved item that cannot be bought (purchasers and team admins, batch `ordering`)
      description: |
        Requires a non-blank `reason` (400 `invalid_request`). The batch must be `ordering` (422 `batch_not_ordering`), the item
        `approved` (else 409 `invalid_transition`) and not part of an order (422 `item_in_order`: remove it from the order first).
        The batch may advance automatically in the same transaction (to `receiving`, or `completed` when every approved item is
        unpurchasable); the response is the updated item. System admins have no implicit purchaser role (403).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnpurchasableRequest" }
      responses:
        "200":
          description: Updated item
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `invalid_transition`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /batches/{id}/orders:
    parameters:
      - $ref: "#/components/parameters/BatchId"
    get:
      operationId: listBatchOrders
      summary: List the batch's team orders (anyone who can read the batch)
      description: "Returns all orders by number, cancelled ones included, not paginated (`{items}` only)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createOrder
      summary: Create a draft team order from approved items (purchasers and team admins, batch `ordering`)
      description: |
        `vendor` is required (at most 200 characters) and `itemIds` lists 1 or more distinct items of the batch. Every item must be
        `approved` and in no live order (422 `item_not_orderable`); an id that is not an item of this batch is 400. The batch
        must be `ordering` (422 `batch_not_ordering`). System admins have no implicit purchaser role (403). Orders are numbered
        per batch. No `If-Match`; the new order's version is in `ETag`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      operationId: patchOrder
      summary: Change a draft order's vendor and/or items (purchasers and team admins)
      description: |
        Only the fields present change; `itemIds`, when present, replaces the whole item set (added items must be approved and in
        no live order, removed items are released). Only a draft order outside any external order can change (422
        `order_not_draft`, `order_in_transaction`: cancel the external order first), while the batch is `ordering` or
        `receiving` (422 `batch_not_ordering`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchOrderRequest" }
      responses:
        "200":
          description: Updated order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: cancelOrder
      summary: Cancel a draft order and release its items (purchasers and team admins)
      description: |
        The order is kept with status `cancelled` and returned. Same restrictions as `PATCH`
        (422 `order_not_draft`, `order_in_transaction`, `batch_not_ordering`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The cancelled order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-transactions:
    post:
      operationId: createVendorTransaction
      summary: Create a draft external order from draft team orders (purchaser of every involved batch)
      description: |
        The orders may belong to several teams and batches. The caller must be able to read at least one of them (else 404, also
        for unknown ids) and be purchaser of every involved batch (team admins implicitly; system admins not: 403). Every order
        must be a draft outside any external order (422 `order_not_available`) and every batch `ordering` (422
        `batch_not_ordering`). `currency` must be a supported currency (the vendor's billing currency). `vendor` defaults to
        the orders' common vendor and is required (400) when they differ. No `If-Match`; the version is in `ETag`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorTransactionRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorTransactionView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/VendorTransactionId"
    get:
      operationId: getVendorTransaction
      summary: External order details (anyone who can read at least one of its orders)
      description: |
        Orders the caller cannot read are not listed and their ids, teams, batches and allocations are left out of the response;
        only `hiddenOrderCount` and `hiddenOrdersTotalBase` (the sum of their base totals) describe them (spec §8.2).
        Otherwise 404.
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorTransactionView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchVendorTransaction
      summary: Edit prices, shared costs, allocation and the charged amount (purchaser of every involved batch)
      description: |
        A partial update: only fields present change (`sharedCosts`, `allocations` and `itemPrices` replace or merge as described
        on their schemas). Allowed while the external order is `draft` or `placed` (422 `vendor_transaction_cancelled`), also after
        the batch moved on, because bills arrive late. Costs (spec §11) are recalculated in the same transaction and every
        change is audited on each involved batch.

        Validation (400 `invalid_request`, `details.fields`): money fits the minor unit of its currency (shared costs and
        prices: the transaction currency; `chargedAmountBase`: the base currency), a `discount` is not positive, prices use the
        transaction currency and are not negative, `itemPrices` name items of this external order.

        Business rules (422): `allocations` must name every order once; if any share differs from the proportional share the
        shares are a manual override: they must add up to the total of the shared costs (`allocation_sum_mismatch`) and a
        non-blank `allocationOverrideReason` is required (`allocation_override_reason_required`). Changing `sharedCosts`
        while a manual override exists without sending new `allocations` fails with `allocation_sum_mismatch` unless the new
        total still equals the stored shares; send `allocations: null` to go back to proportional allocation.
        `cost_basis_zero`: a non-zero charged amount cannot be spread while the priced total is zero.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchVendorTransactionRequest" }
      responses:
        "200":
          description: Updated external order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorTransactionView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-transactions/{id}/place:
    parameters:
      - $ref: "#/components/parameters/VendorTransactionId"
    post:
      operationId: placeVendorTransaction
      summary: Place a draft external order (purchaser of every involved batch)
      description: |
        In one transaction: the external order and its orders become `placed`, their items `ordered`, and each batch's automatic
        transition is evaluated (`ordering` to `receiving`, or `completed`). 422 `vendor_transaction_not_draft`, `batch_not_ordering`.
        No request body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Placed external order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorTransactionView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /vendor-transactions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/VendorTransactionId"
    post:
      operationId: cancelVendorTransaction
      summary: Cancel a draft external order and release its orders (purchaser of every involved batch)
      description: |
        The team orders go back to plain drafts and their actual prices are cleared. A placed external order cannot be cancelled
        (422 `vendor_transaction_not_draft`); problems after placing are handled with item exceptions and adjustments. No request body.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Cancelled external order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorTransactionView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me/tasks:
    get:
      operationId: getMyTasks
      summary: Work waiting for the caller
      description: |
        `batchesToOrder` lists batches in `ordering` where the caller is a purchaser (team admins implicitly) and approved items
        still wait for an order or an unpurchasable mark; `count` is the number of those items. `itemsToReceive` and
        `openExceptions` are always empty until a later milestone.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTasks" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /audit:
    get:
      operationId: getAudit
      summary: Timeline of a batch (including its items' events) or of an item
      description: Cursor-paginated, oldest event first. Anyone who can read the batch may read it. A malformed `objectId` yields 404; any other `objectType` yields 400; a bad `limit` 400 `invalid_request`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: objectType, in: query, required: true, schema: { type: string, enum: [batch, item] } }
        - { name: objectId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /teams/{teamId}/audit:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: getTeamAudit
      summary: Team-wide audit log (team admins and system admins)
      description: Cursor-paginated, newest event first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestID:
      description: |
        Request id for log correlation: the client's `X-Request-ID` when valid, otherwise one generated by the
        server (32 hex characters). Present on every response.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    ETag:
      description: Resource version as a quoted integer, e.g. `"3"`. Send it back in `If-Match`.
      schema: { type: string, examples: ['"3"'] }
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      description: Team id (24-hex). A malformed id yields 404 `not_found`.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      description: User id (24-hex). A malformed id yields 404 `not_found`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size, default 50; values above 100 clamp to 100. Non-numeric or < 1 yields 400 `invalid_request`.
      schema: { type: integer, minimum: 1, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `nextCursor`; malformed values yield 400 `invalid_request`.
      schema: { type: string }
    BatchId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string }
    VendorTransactionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Current resource version, as received in `ETag` (`"3"`, `W/"3"` or `3` are accepted).
        Missing header yields 428 `if_match_required`; a non-numeric or < 1 value yields 400 `invalid_if_match`;
        a stale version yields 409 `version_conflict`. (The handlers never return 412.)
      schema: { type: string }
  responses:
    BadRequest:
      description: |
        Validation or malformed request. Codes: `invalid_request` (malformed or missing body, invalid parameters
        such as `limit` or `cursor`, or field validation; field errors are in `details.fields`, a map of field to
        message) and `invalid_if_match`.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired token, or not an access token (`unauthenticated`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `missing_role`: the caller holds none of the `ALLOWED_ROLES` (and is not a system admin), so cannot use the
        service at all; returned by every authenticated operation before any other processing, and no user record is
        created. `forbidden`: the caller lacks the permission for this action.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found` (also returned for malformed ids)"
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: "`version_conflict`: the If-Match version is stale; refetch and retry."
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "`payload_too_large`"
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IfMatchRequired:
      description: "`if_match_required`"
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: |
        `upstream_unavailable`: a dependency is unavailable. Authenticated operations return it while the OIDC
        discovery document has not been loaded yet (the IdP was unreachable at startup; the server keeps retrying
        and `/readyz` reports the `oidc` check as failing). Retry later; this is not a token problem.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: |
        Business-rule violation. Codes: `team_slug_taken`, `team_archived`, `subgroup_exists`,
        `member_no_role_source`, `member_managed_by_sso`, `role_mapping_managed`, `batch_not_collecting`,
        `batch_not_reviewing`, `batch_closed`, `assignments_incomplete`, `deadline_required`, `deadline_not_in_future`,
        `no_pending_items`, `reason_required`, `item_not_editable`, `item_not_edited`, `item_not_reviewable`, `batch_item_limit` (more than 5000 non-withdrawn items in a batch),
        `batch_not_ordering`, `item_not_orderable`, `item_in_order`, `order_not_draft`, `order_in_transaction`, `order_not_available`,
        `vendor_transaction_not_draft`, `vendor_transaction_cancelled`, `allocation_sum_mismatch`, `allocation_override_reason_required`, `cost_basis_zero`.
        (`invalid_transition` is a business rule too but is returned as HTTP 409.)
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Role:
      type: string
      enum: [member, admin]
    RoleOrNone:
      description: A role, or the empty string when the role source is not set.
      type: string
      enum: ["", member, admin]
    Locale:
      type: string
      enum: [en, zh-TW]
    Visibility:
      type: string
      enum: [public, members]
    NotificationPref:
      type: object
      required: [email]
      properties:
        email: { type: boolean }
    MyMembership:
      type: object
      required: [teamId, slug, name, role, ssoRole, manualRole, defaultSubgroupId]
      properties:
        teamId: { type: string }
        slug: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/RoleOrNone", description: Effective role (higher of ssoRole and manualRole). }
        ssoRole: { $ref: "#/components/schemas/RoleOrNone" }
        manualRole: { $ref: "#/components/schemas/RoleOrNone" }
        defaultSubgroupId: { type: string, description: Empty string when unset. }
    Me:
      type: object
      required: [id, username, email, displayName, locale, notificationPrefs, createdAt, updatedAt, version, memberships, isSystemAdmin]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        locale:
          description: |
            The locale the user chose, or null if they never chose one; the client then follows the browser
            language (falling back to `en`). Set it with `PATCH /me`.
          oneOf: [{ $ref: "#/components/schemas/Locale" }, { type: "null" }]
        notificationPrefs:
          type: [object, "null"]
          additionalProperties: { $ref: "#/components/schemas/NotificationPref" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/MyMembership" }
        isSystemAdmin: { type: boolean }
    PatchMeRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
          description: Saves the user's choice. It cannot be cleared back to null.
        notificationPrefs:
          type: object
          description: Replaces the stored map. Keys are event types (1 to 100 characters).
          additionalProperties: { $ref: "#/components/schemas/NotificationPref" }
    User:
      type: object
      required: [id, username, displayName, email]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
    Subgroup:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
    ReferenceRate:
      type: object
      required: [currency, rateToBase, updatedAt, updatedBy]
      properties:
        currency: { type: string }
        rateToBase: { type: string, description: Decimal string. }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: User id. }
    TeamSummary:
      description: What non-members see. Has no `version`.
      type: object
      additionalProperties: false
      required: [id, slug, name, description, archived]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
    Team:
      description: Full team, returned to members and system admins.
      type: object
      required: [id, slug, name, description, visibility, locale, priorityLabels, subgroups, referenceRates, archived, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        locale: { $ref: "#/components/schemas/Locale" }
        priorityLabels:
          type: [object, "null"]
          description: Keys "1" to "5". Null or missing keys mean the built-in default label applies.
          additionalProperties: { type: string }
        subgroups:
          type: array
          items: { $ref: "#/components/schemas/Subgroup" }
        referenceRates:
          type: array
          items: { $ref: "#/components/schemas/ReferenceRate" }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [slug, name, firstAdminUserId]
      properties:
        slug: { type: string, maxLength: 63, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        firstAdminUserId: { type: string }
    PatchTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        locale: { $ref: "#/components/schemas/Locale" }
        priorityLabels:
          type: object
          propertyNames: { enum: ["1", "2", "3", "4", "5"] }
          additionalProperties: { type: string, maxLength: 200 }
        archived:
          type: boolean
          description: System admin only; cannot be combined with other fields.
    TeamMember:
      type: object
      required: [userId, username, displayName, email, ssoRole, manualRole, effectiveRole, defaultSubgroupId, version]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        ssoRole: { $ref: "#/components/schemas/RoleOrNone" }
        manualRole: { $ref: "#/components/schemas/RoleOrNone" }
        effectiveRole: { $ref: "#/components/schemas/RoleOrNone" }
        defaultSubgroupId: { type: string, description: Empty string when unset. }
        version: { type: integer, format: int64, description: Membership version. }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    PatchMemberRequest:
      type: object
      additionalProperties: false
      properties:
        manualRole:
          description: '"member" or "admin" sets, null clears, absent leaves unchanged.'
          oneOf:
            - { $ref: "#/components/schemas/Role" }
            - { type: "null" }
        defaultSubgroupId: { type: string, description: Empty string clears. }
    AddSubgroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
    PatchSubgroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        active: { type: boolean }
    PutReferenceRatesRequest:
      type: object
      additionalProperties: false
      required: [rates]
      properties:
        rates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, rateToBase]
            properties:
              currency: { type: string }
              rateToBase: { type: string, description: Positive decimal string. }
    RoleMapping:
      type: object
      required: [id, claim, pattern, team, role, enabled, managed, description, version]
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        claim: { type: string, enum: [groups, roles] }
        pattern: { type: string, description: "Glob over `/`-separated segments; `*` matches exactly one whole segment, captured as $1, $2, ..." }
        team: { type: string, description: Team slug; may reference captures such as `$1`. }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        managed: { type: boolean, description: True when loaded from the rules file; read-only. }
        description: { type: string }
    CreateRoleMappingRequest:
      type: object
      additionalProperties: false
      required: [claim, pattern, team, role, enabled]
      properties:
        claim: { type: string, enum: [groups, roles] }
        pattern: { type: string }
        team: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        description: { type: string }
    RoleMappingRequest:
      description: Full replacement body; omitted fields are cleared.
      type: object
      additionalProperties: false
      required: [claim, pattern, team, role]
      properties:
        claim: { type: string, enum: [groups, roles] }
        pattern: { type: string }
        team: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        description: { type: string }
    UserList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
    TeamSummaryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TeamSummary" } }
    TeamMemberList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
    RoleMappingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RoleMapping" } }
    Meta:
      type: object
      required: [version, commit, baseCurrency, supportedCurrencies, lookupEnabled, emailEnabled]
      properties:
        version: { type: string }
        commit: { type: string }
        baseCurrency: { type: string }
        supportedCurrencies: { type: array, items: { type: string } }
        lookupEnabled: { type: boolean }
        emailEnabled: { type: boolean }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: 'Decimal string with no fixed number of fractional digits ("12.5", "100").' }
        currency: { type: string }
    BatchStatus:
      type: string
      enum: [proposed, proposal_rejected, draft, collecting, reviewing, ordering, receiving, completed, cancelled]
    BatchAction:
      type: string
      enum: [open, start_review, close, reopen, cancel, reject_proposal, withdraw_proposal]
    Assignments:
      type: object
      required: [approvers, purchasers, receivers]
      properties:
        approvers: { type: array, items: { type: string } }
        purchasers: { type: array, items: { type: string } }
        receivers: { type: array, items: { type: string } }
    Batch:
      type: object
      required: [id, teamId, number, title, description, status, origin, createdBy, deadline, assignments, visibilityOverride, statusReason, statusChangedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        teamId: { type: string }
        number: { type: integer, description: Per-team batch number. }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/BatchStatus" }
        origin: { type: string, enum: [created, proposed] }
        createdBy: { type: string, description: User id. }
        deadline: { type: [string, "null"], format: date-time }
        assignments: { $ref: "#/components/schemas/Assignments" }
        visibilityOverride:
          description: Empty string when there is no override.
          type: string
          enum: ["", public, members]
        statusReason: { type: string }
        statusChangedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        propose: { type: boolean, description: Team admins set true to propose instead of creating a draft. }
    PatchBatchRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        deadline: { type: [string, "null"], format: date-time, description: null clears. }
        visibilityOverride:
          description: null clears.
          oneOf:
            - { $ref: "#/components/schemas/Visibility" }
            - { type: "null" }
    AssignmentsRequest:
      type: object
      additionalProperties: false
      properties:
        approvers: { type: array, items: { type: string } }
        purchasers: { type: array, items: { type: string } }
        receivers: { type: array, items: { type: string } }
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/BatchAction" }
        reason: { type: string }
        deadline: { type: [string, "null"], format: date-time }
    ItemStatus:
      type: string
      enum: [pending, withdrawn, approved, returned, rejected, ordered, unpurchasable, partially_received, received, exception, accepted_short, not_obtained]
    Review:
      type: object
      required: [decision, by, at, comment, forced, atVersion]
      properties:
        decision: { type: string, enum: [approved, returned, rejected] }
        by: { type: string }
        at: { type: string, format: date-time }
        comment: { type: string }
        forced: { type: boolean }
        atVersion:
          type: integer
          format: int64
          description: Item version produced by this decision. A returned item may be resubmitted only once item.version is greater than this (i.e. it was edited since).
    LookupInfo:
      type: object
      required: [provider, fetchedAt, autoFilledFields]
      properties:
        provider: { type: string }
        fetchedAt: { type: string, format: date-time }
        autoFilledFields: { type: array, items: { type: string } }
    Item:
      type: object
      required: [id, teamId, batchId, seqNo, requesterId, subgroupId, name, vendor, sku, quantity, estimatedUnitPrice, priority, purpose, notes, productUrl, status, review, lookup, orderId, actualUnitPrice, actualCostBase, receivedQuantity, closeReason, customFields, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        teamId: { type: string }
        batchId: { type: string }
        seqNo: { type: integer, description: Per-batch item number. }
        requesterId: { type: string }
        subgroupId: { type: string, description: Empty string when unset. }
        name: { type: string }
        vendor: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        estimatedUnitPrice: { $ref: "#/components/schemas/Money" }
        priority: { type: integer, minimum: 1, maximum: 5 }
        purpose: { type: string }
        notes: { type: string }
        productUrl: { type: string }
        status: { $ref: "#/components/schemas/ItemStatus" }
        review: { oneOf: [{ $ref: "#/components/schemas/Review" }, { type: "null" }] }
        lookup: { oneOf: [{ $ref: "#/components/schemas/LookupInfo" }, { type: "null" }] }
        orderId: { type: [string, "null"] }
        actualUnitPrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        actualCostBase: { type: [string, "null"], description: Decimal string. }
        receivedQuantity: { type: integer }
        closeReason: { type: string }
        customFields: { type: [object, "null"], additionalProperties: true, description: Reserved. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ItemRequest:
      type: object
      additionalProperties: false
      required: [name, quantity, estimatedUnitPrice, priority, purpose]
      properties:
        subgroupId: { type: string }
        name: { type: string, maxLength: 300 }
        vendor: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        estimatedUnitPrice: { $ref: "#/components/schemas/Money" }
        priority: { type: integer, minimum: 1, maximum: 5 }
        purpose: { type: string }
        notes: { type: string }
        productUrl: { type: string, description: http or https URL. }
        autoFilledFields: { type: array, items: { type: string } }
        lookupProvider: { type: string }
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [itemId, decision]
            properties:
              itemId: { type: string }
              decision: { type: string, enum: [approve, return, reject] }
              comment: { type: string, description: Required for return and reject. }
    ReviewResult:
      type: object
      required: [batch, items]
      properties:
        batch: { $ref: "#/components/schemas/Batch" }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
    ForceRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string }
    BatchTask:
      type: object
      required: [batch, count]
      properties:
        batch: { $ref: "#/components/schemas/Batch" }
        count: { type: integer, description: "Number of pending items (itemsToReview) or of approved items not yet ordered or marked unpurchasable (batchesToOrder); 0 otherwise." }
    MyTasks:
      type: object
      required: [proposalsToHandle, itemsToReview, returnedItems, batchesToOrder, itemsToReceive, openExceptions]
      properties:
        proposalsToHandle: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        itemsToReview: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        returnedItems: { type: array, items: { $ref: "#/components/schemas/Item" } }
        batchesToOrder: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        itemsToReceive: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        openExceptions: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
    UnpurchasableRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string }
    OrderStatus:
      type: string
      description: Status of a team order and of an external order.
      enum: [draft, placed, cancelled]
    Order:
      type: object
      required: [id, teamId, batchId, number, vendor, itemIds, vendorTransactionId, status, itemsCostBase, sharedCostBase, adjustmentsBase, totalBase, costsProvisional, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        teamId: { type: string }
        batchId: { type: string }
        number: { type: integer, description: Per-batch order number. }
        vendor: { type: string }
        itemIds: { type: array, items: { type: string }, description: Kept on cancelled orders for history. }
        vendorTransactionId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        itemsCostBase: { type: string, description: "Decimal string, base currency; 0 until costs are computed." }
        sharedCostBase: { type: string, description: "Decimal string, base currency (this order's allocation of the shared costs)." }
        adjustmentsBase: { type: string, description: "Decimal string, base currency; sum of the order's adjustments (refunds are negative)." }
        totalBase: { type: string, description: "Decimal string: itemsCostBase + sharedCostBase + adjustmentsBase." }
        costsProvisional: { type: boolean, description: "True while the figures are not final: prices are missing, or they were converted with a reference rate." }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    OrderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [vendor, itemIds]
      properties:
        vendor: { type: string, maxLength: 200 }
        itemIds: { type: array, minItems: 1, maxItems: 5000, items: { type: string } }
    PatchOrderRequest:
      type: object
      additionalProperties: false
      properties:
        vendor: { type: string, maxLength: 200 }
        itemIds: { type: array, minItems: 1, maxItems: 5000, items: { type: string }, description: Replaces the item set. }
    SharedCostType:
      type: string
      enum: [shipping, fee, tax, discount, other]
    SharedCost:
      type: object
      required: [type, amount, note]
      properties:
        type: { $ref: "#/components/schemas/SharedCostType" }
        amount: { type: string, description: "Decimal string in the external order's currency; negative for discounts." }
        note: { type: string }
    SharedCostRequest:
      type: object
      additionalProperties: false
      required: [type, amount]
      properties:
        type: { $ref: "#/components/schemas/SharedCostType" }
        amount: { type: string, description: "Decimal string in the external order's currency, at most its minor-unit digits; a discount must not be positive." }
        note: { type: string, maxLength: 500 }
    Allocation:
      type: object
      required: [orderId, shareOfSharedCosts, overridden]
      properties:
        orderId: { type: string }
        shareOfSharedCosts: { type: string, description: Decimal string in the external order's currency. }
        overridden: { type: boolean, description: True when the share was set by hand instead of proportionally to the item subtotals. }
    VendorTransaction:
      type: object
      required: [id, vendor, externalOrderNo, currency, orderIds, teamIds, batchIds, status, placedAt, placedBy, sharedCosts, chargedAmountBase, allocations, allocationOverrideReason, expectedDeliveryDate, paymentNote, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        vendor: { type: string }
        externalOrderNo: { type: string }
        currency: { type: string, description: The vendor's billing currency. }
        orderIds: { type: array, items: { type: string } }
        teamIds: { type: array, items: { type: string } }
        batchIds: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/OrderStatus" }
        placedAt: { type: [string, "null"], format: date-time }
        placedBy: { type: [string, "null"] }
        sharedCosts: { type: array, items: { $ref: "#/components/schemas/SharedCost" } }
        chargedAmountBase: { type: [string, "null"], description: "Decimal string: what was actually charged, in the base currency." }
        allocations: { type: array, items: { $ref: "#/components/schemas/Allocation" } }
        allocationOverrideReason: { type: string }
        expectedDeliveryDate: { type: [string, "null"], format: date-time }
        paymentNote: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    OrderDetail:
      type: object
      required: [order, items]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        items:
          type: array
          description: The order's item lines, with `actualUnitPrice` and `actualCostBase`.
          items: { $ref: "#/components/schemas/Item" }
    VendorTransactionView:
      description: |
        An external order as seen by one caller. Orders the caller cannot read are omitted from `orders`, `orderIds`, `teamIds`,
        `batchIds` and `allocations`; `hiddenOrderCount` and `hiddenOrdersTotalBase` summarise them.
      allOf:
        - $ref: "#/components/schemas/VendorTransaction"
        - type: object
          required: [orders, hiddenOrderCount, hiddenOrdersTotalBase]
          properties:
            orders: { type: array, items: { $ref: "#/components/schemas/OrderDetail" } }
            hiddenOrderCount: { type: integer }
            hiddenOrdersTotalBase: { type: string, description: "Decimal string, base currency." }
    CreateVendorTransactionRequest:
      type: object
      additionalProperties: false
      required: [orderIds, currency]
      properties:
        orderIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        currency: { type: string, description: A supported currency code. }
        vendor: { type: string, maxLength: 200 }
        externalOrderNo: { type: string, maxLength: 200 }
    PatchVendorTransactionRequest:
      type: object
      additionalProperties: false
      properties:
        vendor: { type: string, maxLength: 200 }
        externalOrderNo: { type: string, maxLength: 200 }
        paymentNote: { type: string, maxLength: 2000 }
        expectedDeliveryDate: { type: [string, "null"], format: date-time }
        sharedCosts:
          type: array
          maxItems: 50
          description: Replaces the whole list of shared costs.
          items: { $ref: "#/components/schemas/SharedCostRequest" }
        chargedAmountBase:
          type: [string, "null"]
          description: "Decimal string in the base currency, at most its minor-unit digits, not negative. `null` clears it."
        allocations:
          type: [array, "null"]
          description: |
            One entry per order: a share of the total of the shared costs, in the external order's currency. Entries that differ from
            the proportional share are overrides. `null` resets to proportional allocation.
          items:
            type: object
            additionalProperties: false
            required: [orderId, shareOfSharedCosts]
            properties:
              orderId: { type: string }
              shareOfSharedCosts: { type: string }
        allocationOverrideReason: { type: string, maxLength: 500, description: Required while any allocation is overridden. }
        itemPrices:
          type: array
          description: Merged by item. A null price clears the item's actual price.
          items:
            type: object
            additionalProperties: false
            required: [itemId, actualUnitPrice]
            properties:
              itemId: { type: string }
              actualUnitPrice:
                oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
    AuditChange:
      type: object
      required: [field, from, to]
      properties:
        field: { type: string }
        from:
          description: Previous value; any JSON type, null when there was none.
          type: [string, number, integer, boolean, object, array, "null"]
        to:
          description: New value; any JSON type, null when cleared.
          type: [string, number, integer, boolean, object, array, "null"]
    AuditEvent:
      type: object
      required: [id, at, actor, objectType, objectId, action, changes]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: 'User id, or "system:<job>".' }
        teamId: { type: string, description: Zero id "000000000000000000000000" when not set (see notes). }
        batchId: { type: string, description: Set for batch and item events. }
        objectType: { type: string }
        objectId: { type: string }
        action: { type: string, description: 'e.g. batch.created, batch.open, item.approved.' }
        changes: { type: [array, "null"], items: { $ref: "#/components/schemas/AuditChange" } }
        comment: { type: string }
    BatchPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Batch" } }
        nextCursor: { type: [string, "null"] }
    ItemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "English fallback text; clients localize by `code`." }
            details: { type: object, additionalProperties: true }
    ErrorCode:
      type: string
      description: |
        Stable lowercase snake_case error code (spec §16.1). 400 `invalid_request`, `invalid_if_match`;
        401 `unauthenticated`; 403 `forbidden`, `missing_role`; 404 `not_found`; 409 `version_conflict`, `invalid_transition`;
        413 `payload_too_large`; 428 `if_match_required`; 500 `internal_error` (no internal details);
        503 `upstream_unavailable`;
        422 for every other (business-rule) code.
      enum:
        - invalid_request
        - invalid_if_match
        - unauthenticated
        - forbidden
        - missing_role
        - not_found
        - version_conflict
        - invalid_transition
        - payload_too_large
        - if_match_required
        - internal_error
        - upstream_unavailable
        - team_slug_taken
        - team_archived
        - subgroup_exists
        - member_no_role_source
        - member_managed_by_sso
        - role_mapping_managed
        - batch_not_collecting
        - batch_not_reviewing
        - batch_closed
        - batch_item_limit
        - assignments_incomplete
        - deadline_required
        - deadline_not_in_future
        - no_pending_items
        - reason_required
        - item_not_editable
        - item_not_edited
        - item_not_reviewable
        - batch_not_ordering
        - item_not_orderable
        - item_in_order
        - order_not_draft
        - order_in_transaction
        - order_not_available
        - vendor_transaction_not_draft
        - vendor_transaction_cancelled
        - allocation_sum_mismatch
        - allocation_override_reason_required
        - cost_basis_zero
