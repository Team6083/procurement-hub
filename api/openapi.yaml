      properties:
        id: { type: string }
        teamId: { type: string }
        batchId: { type: string }
        seqNo: { type: integer }
        requesterId: { type: string }
        name: { type: string }
        vendorId: { type: [string, "null"] }
        vendorName: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        estimatedUnitPrice: { $ref: "#/components/schemas/Money" }
        priority: { type: integer }
        purpose: { type: string }
        productUrl: { type: string }
        status: { type: string }
        version: { type: integer, format: int64 }
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "English fallback text; clients localize by `code`." }
            details: { type: object, additionalProperties: true }
    ErrorCode:
      type: string
      description: |
        Stable lowercase snake_case error code (spec §16.1). 400 `invalid_request`, `invalid_if_match`;
        401 `unauthenticated`; 403 `forbidden`, `missing_role`; 404 `not_found`; 409 `version_conflict`, `invalid_transition`, `subgroup_name_conflict` (`details.value`), `blocked_by_dependency` (`details.blockers`: `[{type, id, label}]`);
        413 `payload_too_large`; 428 `if_match_required`; 500 `internal_error` (no internal details);
        503 `upstream_unavailable`, `lookup_disabled`; 504 `upstream_timeout`; 429 `rate_limited`; 404 `lookup_not_found`;
        422 for every other (business-rule) code.
      enum:
        - invalid_request
        - invalid_if_match
        - unauthenticated
        - forbidden
        - missing_role
        - not_found
        - version_conflict
        - invalid_transition
        - payload_too_large
        - if_match_required
        - internal_error
        - upstream_unavailable
        - team_slug_taken
        - team_archived
        - subgroup_name_conflict
        - member_no_role_source
        - member_managed_by_sso
        - role_mapping_managed
        - batch_not_collecting
        - batch_not_reviewing
        - batch_closed
        - batch_item_limit
        - assignments_incomplete
        - deadline_required
        - deadline_not_in_future
        - no_pending_items
        - reason_required
        - item_not_editable
        - item_not_deletable
        - item_not_edited
        - item_not_reviewable
        - blocked_by_dependency
        - vendor_name_taken
        - items_undecided
        - line_quantity_exceeded
        - shared_cost_allocation_invalid
        - item_not_purchasable
        - item_already_on_order
        - order_not_draft
        - order_locked
        - line_locked
        - unit_price_required
        - order_has_no_lines
        - line_missing_price
        - order_not_placed
        - cost_entry_voided
        - line_not_closable
        - line_not_matchable
        - lookup_not_found
        - lookup_disabled
        - upstream_timeout
        - rate_limited
    VoidInfo:
      type: object
      required: [reason, by, at]
      properties:
        reason: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
