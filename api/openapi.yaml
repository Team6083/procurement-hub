        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /problems:
    get:
      operationId: listProblems
      summary: "Delivery problems, not voided (purchasers, receivers, system admins; 404 for others)"
      description: Newest first, at most 500; not paginated. Each problem carries its own `version` for `If-Match`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: vendorOrderId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /problems/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: resolveProblem
      summary: "Settle an open problem (purchasers)"
      description: |
        `exchange` (wait for a replacement; counts in no quantity), `return_no_replace` (counts as returned; optional `refund` with a positive `amount`, stored as a negative `refund` cost entry on the line, source `problem`)
        or `accept` (counts as received). `refund` with any other action yields 400. `If-Match` is the problem version.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
