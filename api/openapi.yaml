  /purchasing/match-candidates:
    get:
      operationId: getMatchCandidates
      summary: "Candidate vendor order lines for a box line that is not saved yet"
      description: Same rules as the suggestions of a saved line, without a suggested split. `sku` or `name` is required (400 otherwise). Purchasers and receivers.
      parameters:
        - { name: sku, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
