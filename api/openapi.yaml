      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Reopened problem
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestID:
      description: |
        Request id for log correlation: the client's `X-Request-ID` when valid, otherwise one generated by the
        server (32 hex characters). Present on every response.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    ETag:
      description: Resource version as a quoted integer, e.g. `"3"`. Send it back in `If-Match`.
      schema: { type: string, examples: ['"3"'] }
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      description: Team id (24-hex). A malformed id yields 404 `not_found`.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      description: User id (24-hex). A malformed id yields 404 `not_found`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size, default 50; values above 100 clamp to 100. Non-numeric or < 1 yields 400 `invalid_request`.
      schema: { type: integer, minimum: 1, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `nextCursor`; malformed values yield 400 `invalid_request`.
      schema: { type: string }
    BatchId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource id (24-hex). A malformed id yields 404 `not_found`.
      schema: { type: string }
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Current resource version, as received in `ETag` (`"3"`, `W/"3"` or `3` are accepted).
        Missing header yields 428 `if_match_required`; a non-numeric or < 1 value yields 400 `invalid_if_match`;
        a stale version yields 409 `version_conflict`. (The handlers never return 412.)
      schema: { type: string }
  responses:
    BadRequest:
      description: |
        Validation or malformed request. Codes: `invalid_request` (malformed or missing body, invalid parameters
        such as `limit` or `cursor`, or field validation; field errors are in `details.fields`, a map of field to
        message) and `invalid_if_match`.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired token, or not an access token (`unauthenticated`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `missing_role`: the caller holds none of the `ALLOWED_ROLES` (and is not a system admin), so cannot use the
        service at all; returned by every authenticated operation before any other processing, and no user record is
        created. `forbidden`: the caller lacks the permission for this action.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found` (also returned for malformed ids)"
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: "`version_conflict`: the If-Match version is stale; refetch and retry."
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SubgroupConflict:
      description: >-
        `version_conflict`: the If-Match version is stale; refetch and retry. `subgroup_name_conflict`: the name or an
        alias is already the name or an alias of another subgroup in the team; `details.value` is the clashing value as
        sent (trimmed).
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "`version_conflict`, `invalid_transition` or `blocked_by_dependency` (`details.blockers`: `[{type, id, label, parentId?}]`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "`payload_too_large`"
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IfMatchRequired:
      description: "`if_match_required`"
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: |
        `upstream_unavailable`: a dependency is unavailable (also `lookup_disabled` on `GET /lookup`). Authenticated operations return it while the OIDC
        discovery document has not been loaded yet (the IdP was unreachable at startup; the server keeps retrying
        and `/readyz` reports the `oidc` check as failing). Retry later; this is not a token problem.
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: |
        Business-rule violation. Codes: `team_slug_taken`, `team_archived`,
        `member_no_role_source`, `member_managed_by_sso`, `role_mapping_managed`, `batch_not_collecting`,
        `batch_not_reviewing`, `batch_closed`, `assignments_incomplete`, `deadline_required`, `deadline_not_in_future`,
        `no_pending_items`, `reason_required`, `item_not_editable`, `item_not_deletable`, `item_not_edited`, `item_not_reviewable`, `batch_item_limit` (more than 5000 non-withdrawn items in a batch),
        `vendor_name_taken`, `items_undecided` (confirm_review with pending/returned items), `line_quantity_exceeded`, `shared_cost_allocation_invalid`,
        `item_not_purchasable`, `item_already_on_order`, `order_not_draft`, `order_locked`, `line_locked`, `unit_price_required`, `order_has_no_lines`,
        `line_missing_price`, `order_not_placed`, `cost_entry_voided`, `line_not_closable`, `line_not_matchable`.
        (`invalid_transition` and `subgroup_name_conflict` are business rules too but are returned as HTTP 409.)
      headers:
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Role:
      type: string
      enum: [member, admin]
    RoleOrNone:
      description: A role, or the empty string when the role source is not set.
      type: string
      enum: ["", member, admin]
    Locale:
      type: string
      enum: [en, zh-TW]
    Visibility:
      type: string
      enum: [public, members]
    NotificationPref:
      type: object
      required: [email]
      properties:
        email: { type: boolean }
    MyMembership:
      type: object
      required: [teamId, slug, name, role, ssoRole, manualRole, defaultSubgroupId]
      properties:
        teamId: { type: string }
        slug: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/RoleOrNone", description: Effective role (higher of ssoRole and manualRole). }
        ssoRole: { $ref: "#/components/schemas/RoleOrNone" }
        manualRole: { $ref: "#/components/schemas/RoleOrNone" }
        defaultSubgroupId: { type: string, description: Empty string when unset. }
    Me:
      type: object
      required: [id, username, email, displayName, locale, notificationPrefs, createdAt, updatedAt, version, memberships, isSystemAdmin, isPurchaser, isReceiver]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        locale:
          description: |
            The locale the user chose, or null if they never chose one; the client then follows the browser
            language (falling back to `en`). Set it with `PATCH /me`.
          oneOf: [{ $ref: "#/components/schemas/Locale" }, { type: "null" }]
        notificationPrefs:
          type: [object, "null"]
          additionalProperties: { $ref: "#/components/schemas/NotificationPref" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/MyMembership" }
        isSystemAdmin: { type: boolean }
        isPurchaser: { type: boolean, description: From PURCHASER_ROLES in the current token; system admins do not hold it implicitly. }
        isReceiver: { type: boolean, description: From RECEIVER_ROLES in the current token. }
    PatchMeRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
          description: Saves the user's choice. It cannot be cleared back to null.
        notificationPrefs:
          type: object
          description: Replaces the stored map. Keys are event types (1 to 100 characters).
          additionalProperties: { $ref: "#/components/schemas/NotificationPref" }
    User:
      type: object
      required: [id, username, displayName, email]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
    Subgroup:
      type: object
      required: [id, name, aliases, active]
      properties:
        id: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        active: { type: boolean }
    ReferenceRate:
      type: object
      required: [currency, rateToBase, updatedAt, updatedBy, version]
      properties:
        currency: { type: string }
        rateToBase: { type: string, description: "Decimal string, > 0, at most 6 fractional digits." }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: User id. }
        version: { type: integer, format: int64 }
    ReferenceRateList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReferenceRate" } }
    PutReferenceRateRequest:
      type: object
      additionalProperties: false
      required: [rateToBase]
      properties:
        rateToBase: { type: string, description: Positive decimal string. }
    Vendor:
      type: object
      required: [id, name, aliases, defaultCurrency, website, notes, active, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        defaultCurrency: { type: string }
        website: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    VendorList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Vendor" } }
    VendorRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        aliases: { type: array, items: { type: string } }
        defaultCurrency: { type: string, description: Defaults to the base currency. }
        website: { type: string }
        notes: { type: string }
        active: { type: boolean, description: "Ignored on create (always true); on PUT, false deactivates." }
    TeamSummary:
      description: What non-members see. Has no `version`.
      type: object
      additionalProperties: false
      required: [id, slug, name, description, archived]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
    Team:
      description: Full team, returned to members and system admins.
      type: object
      required: [id, slug, name, description, visibility, locale, priorityLabels, subgroups, archived, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        locale: { $ref: "#/components/schemas/Locale" }
        priorityLabels:
          type: [object, "null"]
          description: Keys "1" to "5". Null or missing keys mean the built-in default label applies.
          additionalProperties: { type: string }
        subgroups:
          type: array
          items: { $ref: "#/components/schemas/Subgroup" }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [slug, name, firstAdminUserId]
      properties:
        slug: { type: string, maxLength: 63, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        firstAdminUserId: { type: string }
    PatchTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        locale: { $ref: "#/components/schemas/Locale" }
        priorityLabels:
          type: object
          propertyNames: { enum: ["1", "2", "3", "4", "5"] }
          additionalProperties: { type: string, maxLength: 200 }
        archived:
          type: boolean
          description: System admin only; cannot be combined with other fields.
    TeamMember:
      type: object
      required: [userId, username, displayName, email, ssoRole, manualRole, effectiveRole, defaultSubgroupId, version]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        ssoRole: { $ref: "#/components/schemas/RoleOrNone" }
        manualRole: { $ref: "#/components/schemas/RoleOrNone" }
        effectiveRole: { $ref: "#/components/schemas/RoleOrNone" }
        defaultSubgroupId: { type: string, description: Empty string when unset. }
        version: { type: integer, format: int64, description: Membership version. }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    PatchMemberRequest:
      type: object
      additionalProperties: false
      properties:
        manualRole:
          description: '"member" or "admin" sets, null clears, absent leaves unchanged.'
          oneOf:
            - { $ref: "#/components/schemas/Role" }
            - { type: "null" }
        defaultSubgroupId: { type: string, description: Empty string clears. }
    AddSubgroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        aliases: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
    PatchSubgroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        aliases: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
        active: { type: boolean }
    RoleMapping:
      type: object
      required: [id, claim, pattern, team, role, enabled, managed, description, version]
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        claim: { type: string, enum: [groups, roles] }
        pattern: { type: string, description: "Glob over `/`-separated segments; `*` matches exactly one whole segment, captured as $1, $2, ..." }
        team: { type: string, description: Team slug; may reference captures such as `$1`. }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        managed: { type: boolean, description: True when loaded from the rules file; read-only. }
        description: { type: string }
    CreateRoleMappingRequest:
      type: object
      additionalProperties: false
      required: [claim, pattern, team, role, enabled]
      properties:
        claim: { type: string, enum: [groups, roles] }
        pattern: { type: string }
        team: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        description: { type: string }
    RoleMappingRequest:
      description: Full replacement body; omitted fields are cleared.
      type: object
      additionalProperties: false
      required: [claim, pattern, team, role]
      properties:
        claim: { type: string, enum: [groups, roles] }
        pattern: { type: string }
        team: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        description: { type: string }
    UserList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
    TeamSummaryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TeamSummary" } }
    TeamMemberList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
    RoleMappingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RoleMapping" } }
    BuildInfo:
      type: object
      required: [version, commit, builtAt]
      properties:
        version: { type: [string, "null"], description: "Release version without the leading v; null for builds that are not a release tag." }
        commit: { type: [string, "null"], description: Git commit SHA; null when unknown. }
        builtAt: { type: [string, "null"], format: date-time, description: Build time in UTC; null for local builds. }
    Meta:
      type: object
      required: [build, baseCurrency, supportedCurrencies, lookupEnabled, emailEnabled]
      properties:
        build: { $ref: "#/components/schemas/BuildInfo" }
        baseCurrency: { type: string }
        supportedCurrencies: { type: array, items: { type: string } }
        lookupEnabled: { type: boolean }
        emailEnabled: { type: boolean }
    LookupResult:
      type: object
      required: [name, vendorId, vendorName, sku, unitPrice, url, inStock]
      properties:
        name: { type: string }
        vendorId: { type: [string, "null"] }
        vendorName: { type: string }
        sku: { type: string }
        unitPrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        url: { type: string }
        inStock: { type: [boolean, "null"] }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: 'Decimal string with no fixed number of fractional digits ("12.5", "100").' }
        currency: { type: string }
    BatchStatus:
      type: string
      enum: [proposed, proposal_rejected, draft, collecting, reviewing, purchasing, receiving, completed, cancelled]
    BatchAction:
      type: string
      enum: [open, start_review, close, reopen, cancel, uncancel, reject_proposal, withdraw_proposal, restore_proposal, confirm_review, unconfirm_review]
    Assignments:
      type: object
      required: [approvers, purchasers]
      properties:
        approvers: { type: array, items: { type: string }, description: Team members. }
        purchasers: { type: array, items: { type: string }, description: "Optional; steers notifications and tasks only, grants nothing." }
    Batch:
      type: object
      required: [id, teamId, number, title, description, status, origin, createdBy, deadline, assignments, reviewConfirmation, visibilityOverride, statusReason, statusChangedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        teamId: { type: string }
        number: { type: integer, description: Per-team batch number. }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/BatchStatus" }
        origin: { type: string, enum: [created, proposed] }
        createdBy: { type: string, description: User id. }
        deadline: { type: [string, "null"], format: date-time }
        assignments: { $ref: "#/components/schemas/Assignments" }
        visibilityOverride:
          description: Empty string when there is no override.
          type: string
          enum: ["", public, members]
        statusBeforeCancel: { type: string, description: "Set while cancelled (or after uncancel is possible)." }
        reviewConfirmation:
          oneOf:
            - type: object
              required: [by, at, purchaseOutside]
              properties:
                by: { type: string }
                at: { type: string, format: date-time }
                purchaseOutside: { type: boolean }
            - { type: "null" }
        statusReason: { type: string }
        statusChangedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        costBase:
          type: [string, "null"]
          description: "Batch cost (spec §11 step 9): sum of the costs of items with placed lines. Null when nothing is placed or when `costIncomplete`. Set on single-batch responses once the review is confirmed."
        costIncomplete: { type: boolean, description: True when a placed item's cost cannot be computed. }
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        propose: { type: boolean, description: Team admins set true to propose instead of creating a draft. }
    PatchBatchRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        deadline: { type: [string, "null"], format: date-time, description: null clears. }
        visibilityOverride:
          description: null clears.
          oneOf:
            - { $ref: "#/components/schemas/Visibility" }
            - { type: "null" }
    AssignmentsRequest:
      type: object
      additionalProperties: false
      properties:
        approvers: { type: array, items: { type: string } }
        purchasers: { type: array, items: { type: string } }
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/BatchAction" }
        reason: { type: string }
        deadline: { type: [string, "null"], format: date-time }
        purchaseOutside: { type: boolean, description: "confirm_review only: buy outside the system; the batch completes." }
    ItemStatus:
      type: string
      enum: [pending, withdrawn, approved, returned, rejected]
    Fulfillment:
      type: string
      enum: [external, unpurchasable, not_ordered, partially_ordered, received, closed, partially_received, ordered]
    Review:
      type: object
      required: [decision, by, at, comment, forced, atVersion]
      properties:
        decision: { type: string, enum: [approved, returned, rejected] }
        by: { type: string }
        at: { type: string, format: date-time }
        comment: { type: string }
        forced: { type: boolean }
        atVersion:
          type: integer
          format: int64
          description: Item version produced by this decision. A returned item may be resubmitted only once item.version is greater than this (i.e. it was edited since).
    LookupInfo:
      type: object
      required: [provider, fetchedAt, autoFilledFields]
      properties:
        provider: { type: string }
        fetchedAt: { type: string, format: date-time }
        autoFilledFields: { type: array, items: { type: string } }
    Item:
      type: object
      required: [id, teamId, batchId, seqNo, requesterId, subgroupId, name, vendorId, vendorName, sku, quantity, estimatedUnitPrice, priority, purpose, notes, productUrl, status, review, firstReviewedAt, relatedItemId, resubmitNote, lookup, unpurchasable, fulfillment, plannedQuantity, toPurchaseQuantity, orderedQuantity, receivedQuantity, costBase, customFields, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        teamId: { type: string }
        batchId: { type: string }
        seqNo: { type: integer, description: Per-batch item number. }
        requesterId: { type: string }
        subgroupId: { type: string, description: Empty string when unset. }
        name: { type: string }
        vendorId: { type: [string, "null"], description: "A vendor from the list, or null for a free-text vendor." }
        vendorName: { type: string, description: "The vendor's name (copied from the list) or the free text." }
        sku: { type: string }
        quantity: { type: integer }
        estimatedUnitPrice: { $ref: "#/components/schemas/Money" }
        priority: { type: integer, minimum: 1, maximum: 5 }
        purpose: { type: string }
        notes: { type: string }
        productUrl: { type: string }
        status: { $ref: "#/components/schemas/ItemStatus" }
        review: { oneOf: [{ $ref: "#/components/schemas/Review" }, { type: "null" }] }
        firstReviewedAt:
          description: Time of the first review decision; never cleared, not even by undoing the decision.
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        relatedItemId: { type: [string, "null"], description: An item of the same batch this one relates to. }
        resubmitNote: { type: string, description: "Reply from the latest resubmission; empty when none." }
        lookup: { oneOf: [{ $ref: "#/components/schemas/LookupInfo" }, { type: "null" }] }
        unpurchasable:
          oneOf:
            - type: object
              required: [by, at, reason]
              properties:
                by: { type: string }
                at: { type: string, format: date-time }
                reason: { type: string }
            - { type: "null" }
        fulfillment: { oneOf: [{ $ref: "#/components/schemas/Fulfillment" }, { type: "null" }] }
        plannedQuantity: { type: integer }
        toPurchaseQuantity: { type: integer }
        orderedQuantity: { type: integer }
        receivedQuantity: { type: integer }
        costBase: { type: [string, "null"], description: Decimal string; placed lines only. }
        customFields: { type: [object, "null"], additionalProperties: true, description: Reserved. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ItemRequest:
      type: object
      additionalProperties: false
      required: [name, quantity, estimatedUnitPrice, priority, purpose]
      properties:
        subgroupId: { type: string }
        name: { type: string, maxLength: 300 }
        vendorId: { type: [string, "null"], description: "A vendor from the list (the name is then taken from it); 400 when unknown." }
        vendorName: { type: string, description: "Free-text vendor when vendorId is null." }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        estimatedUnitPrice: { $ref: "#/components/schemas/Money" }
        priority: { type: integer, minimum: 1, maximum: 5 }
        purpose: { type: string }
        notes: { type: string }
        productUrl: { type: string, description: http or https URL. }
        autoFilledFields: { type: array, items: { type: string } }
        lookupProvider: { type: string }
        relatedItemId: { type: [string, "null"], description: "Create only: an item of the same batch this one relates to." }
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [itemId, decision]
            properties:
              itemId: { type: string }
              decision: { type: string, enum: [approve, return, reject] }
              comment: { type: string, description: Required for return and reject. }
    ReviewResult:
      type: object
      required: [batch, items]
      properties:
        batch: { $ref: "#/components/schemas/Batch" }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
    ResubmitRequest:
      type: object
      additionalProperties: false
      properties:
        resubmitNote: { type: string, description: Optional reply to the approver; required when the item was not edited. }
    ForceRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string }
    BatchTask:
      type: object
      required: [batch, count]
      properties:
        batch: { $ref: "#/components/schemas/Batch" }
        count: { type: integer, description: "Pending items (itemsToReview), decided items (reviewsToConfirm); 0 for proposals." }
    CountTask:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    OwnedCountTask:
      type: object
      required: [count, mine]
      properties:
        count: { type: integer }
        mine: { type: integer, description: "How many of count belong to vendor orders the caller owns." }
    VendorTask:
      type: object
      required: [vendor, count, myBatches]
      properties:
        vendor: { type: [string, "null"] }
        count: { type: integer }
        myBatches: { type: integer }
    MyTasks:
      type: object
      required: [proposalsToHandle, itemsToReview, returnedItems, reviewsToConfirm]
      properties:
        proposalsToHandle: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        itemsToReview: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        returnedItems: { type: array, items: { $ref: "#/components/schemas/Item" } }
        reviewsToConfirm: { type: array, items: { $ref: "#/components/schemas/BatchTask" } }
        itemsToPurchase: { type: array, items: { $ref: "#/components/schemas/VendorTask" } }
