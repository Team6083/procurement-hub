# Static hosting of the production build for the e2e environment: SPA fallback
# like Cloudflare's single-page-application mode, and a fixed config.json.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Spec section 6.2: the build has no environment values; the e2e config
    # points at plain-http localhost services, which scripts/write-config.mjs
    # (https-only CSP origins) deliberately refuses, so it is served from here.
    location = /config.json {
        alias /etc/procurement-hub/config.json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
