# End-to-end test environment (test-only, never a deployment template):
# Keycloak with the committed realm, a single-node MongoDB replica set, the
# backend image built from server/ (`migrate`, then `serve`), a second backend
# built with a different commit (`serve-next`, for the update-banner test), and
# the production SPA build served by nginx with a fixed config.json.
#
# Everything is plain http on localhost. The browser reaches Keycloak as
# http://keycloak:18180 through Chromium's --host-resolver-rules (see
# playwright.config.ts), so the issuer URL is the same for the browser and for
# the backend containers. Bring it up with `npm run e2e:up` (needs dist/ from
# `npm run build`) or run everything at once with `npm run e2e:ci`.
name: procurement-hub-e2e

x-backend: &backend
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &backend-env
    MONGO_URI: mongodb://mongo:27017/procurement_hub?replicaSet=rs0
    LOG_LEVEL: info
    CORS_ALLOWED_ORIGINS: http://localhost:18173
    FRONTEND_URL: http://localhost:18173
    OIDC_ISSUER: http://keycloak:18180/realms/example
    OIDC_AUDIENCE: procurement-hub-api
    ADMIN_ROLES: procurement-hub-api:admin
    ALLOWED_ROLES: procurement-hub-api:user
    # Test-only key; never reuse it anywhere else.
    WEBHOOK_ENCRYPTION_KEY: ZTJlLW9ubHktd2ViaG9vay1rZXktbm90LWEtc2VjcmV0IQ==

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    tmpfs: [/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] })
          };
          if (!db.hello().isWritablePrimary) { quit(1) }
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
      start_interval: 1s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--http-port=18180", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:18180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-example.json:/opt/keycloak/data/import/realm-example.json:ro
    ports:
      - "127.0.0.1:18180:18180"
    healthcheck:
      # The image has no curl; ask the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
      start_interval: 2s

  migrate:
    <<: *backend
    image: procurement-hub:e2e
    build:
      context: ../../server
      args:
        VERSION: e2e
        COMMIT: ${E2E_COMMIT:?set E2E_COMMIT to the commit the SPA was built with}
    command: ["migrate"]
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy

  serve:
    <<: *backend
    image: procurement-hub:e2e
    command: ["serve"]
    environment:
      <<: *backend-env
      ROLE_MAPPINGS_FILE: /etc/procurement-hub/role-mappings.yaml
    volumes:
      - ./role-mappings.yaml:/etc/procurement-hub/role-mappings.yaml:ro
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  # The "newly deployed" backend of spec section 21.8: same database, same
  # configuration, different commit. It loads no ROLE_MAPPINGS_FILE so it never
  # races `serve` over the managed rules.
  serve-next:
    <<: *backend
    image: procurement-hub:e2e-next
    build:
      context: ../../server
      args:
        VERSION: e2e-next
        COMMIT: ${E2E_COMMIT:?}-next
    command: ["serve"]
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:19091:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  web:
    image: nginx:1.31.8-alpine
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config.json:/etc/procurement-hub/config.json:ro
    ports:
      - "127.0.0.1:18173:80"
