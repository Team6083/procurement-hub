version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Stay on TypeScript 6.0.x: the typescript-eslint peer range is <6.1.0 and eslint crashes on TS 7;
      # remove once typescript-eslint supports TS 7.1+
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940)
      - dependency-name: "typescript"
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
