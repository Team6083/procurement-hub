version: 2
registries:
  # @team6083/ui; the Dependabot secret holds a classic token with read:packages.
  team6083-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.TEAM6083_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    registries:
      - team6083-npm
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
