name: ci

on:
  pull_request:
    # `labeled` lets the `e2e` label start the end-to-end job on a pull request.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Weekly scan for vulnerabilities already in the dependency tree.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Run the same versions locally (see CONTRIBUTING.md).
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Pull requests only fail on vulnerabilities they introduce. Vulnerabilities
  # already in the tree are found by the `vulnerabilities` job below.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  vulnerabilities:
    name: vulnerabilities (main and weekly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: govulncheck
        working-directory: server
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
      - name: go test
        # Integration and HTTP contract tests start a mongo:8 replica set with
        # testcontainers-go on the runner's Docker daemon; nothing is skipped.
        env:
          HTTP_COVERAGE_STRICT: "1"
        run: go test -race -count=1 ./...

  web:
    name: web (Node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      # Production builds fail without a commit SHA (spec section 6.3).
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api || {
            echo "src/api is stale: run 'npm run gen:api' in web/ and commit the result."
            exit 1
          }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  e2e:
    name: end-to-end (Playwright)
    # Slow: runs on main, and on a pull request only when it has the `e2e` label.
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    env:
      # Embedded in the SPA and the `serve` image; `serve-next` gets "<sha>-next".
      E2E_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the environment
        # Builds the SPA and both server images, then starts Keycloak, MongoDB,
        # migrate, serve, serve-next and nginx (web/e2e/docker-compose.yml).
        run: npm run e2e:up
      - run: npm run e2e
      - name: Collect service logs
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color --timestamps > e2e-services.log 2>&1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            web/e2e-services.log
          retention-days: 7
      - name: Stop the environment
        if: always()
        run: npm run e2e:down

  image:
    name: container image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Go version from go.mod
        id: go
        run: |
          gomod="$(sed -n 's/^go //p' server/go.mod)"
          dockerfile="$(sed -n 's/^ARG GO_VERSION=//p' server/Dockerfile)"
          if [ "$gomod" != "$dockerfile" ]; then
            echo "server/Dockerfile ARG GO_VERSION=$dockerfile does not match server/go.mod ($gomod)."
            exit 1
          fi
          echo "version=$gomod" >> "$GITHUB_OUTPUT"
      - name: Build time
        id: build
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64
          push: false
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.build.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
